<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">提示解剖学：生产级提示词六件套 × "正确海拔"原则</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">左：一个生产提示词的六个部件与归属位置 · 右：Anthropic 海拔光谱——规则要"具体到能指导行为，抽象到不脆弱"</text>

  <!-- 左：六件套 -->
  <text x="240" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">六件套（各家官方模板的共同结构）</text>

  <rect x="60" y="112" width="360" height="58" rx="9" fill="#2563eb"/>
  <text x="80" y="136" font-size="13" font-weight="bold" fill="#fff">① 角色/身份</text>
  <text x="80" y="156" font-size="11.5" fill="#dbeafe">"你是贸易合同审查助手"</text>
  <rect x="430" y="112" width="110" height="58" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="485" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">放 System</text>
  <text x="485" y="156" text-anchor="middle" font-size="10.5" fill="#3b82f6">全局稳定</text>

  <rect x="60" y="178" width="360" height="58" rx="9" fill="#0891b2"/>
  <text x="80" y="202" font-size="13" font-weight="bold" fill="#fff">② 任务/目标</text>
  <text x="80" y="222" font-size="11.5" fill="#cffafe">"抽取 8 类要素，输出 JSON"</text>
  <rect x="430" y="178" width="110" height="58" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="485" y="203" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0e7490">稳定→System</text>
  <text x="485" y="222" text-anchor="middle" font-size="10.5" fill="#06b6d4">单次→User</text>

  <rect x="60" y="244" width="360" height="58" rx="9" fill="#7c3aed"/>
  <text x="80" y="268" font-size="13" font-weight="bold" fill="#fff">③ 上下文/资料</text>
  <text x="80" y="288" font-size="11.5" fill="#ede9fe">合同原文 · 字段口径 · 术语表</text>
  <rect x="430" y="244" width="110" height="58" rx="9" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="485" y="269" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">放 User</text>
  <text x="485" y="288" text-anchor="middle" font-size="10.5" fill="#8b5cf6">每次都变</text>

  <rect x="60" y="310" width="360" height="58" rx="9" fill="#ea580c"/>
  <text x="80" y="334" font-size="13" font-weight="bold" fill="#fff">④ 示例</text>
  <text x="80" y="354" font-size="11.5" fill="#ffedd5">2~5 个输入→输出样例（含边界负例）</text>
  <rect x="430" y="310" width="110" height="58" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="485" y="335" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c2410c">稳定→System</text>
  <text x="485" y="354" text-anchor="middle" font-size="10.5" fill="#f97316">动态选例→User</text>

  <rect x="60" y="376" width="360" height="58" rx="9" fill="#059669"/>
  <text x="80" y="400" font-size="13" font-weight="bold" fill="#fff">⑤ 格式/约束</text>
  <text x="80" y="420" font-size="11.5" fill="#d1fae5">JSON Schema · 禁止闲话 · 字数语言</text>
  <rect x="430" y="376" width="110" height="58" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="485" y="401" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857">放 System</text>
  <text x="485" y="420" text-anchor="middle" font-size="10.5" fill="#10b981">全局质量约定</text>

  <rect x="60" y="442" width="360" height="58" rx="9" fill="#dc2626"/>
  <text x="80" y="466" font-size="13" font-weight="bold" fill="#fff">⑥ 边界/异常</text>
  <text x="80" y="486" font-size="11.5" fill="#fee2e2">"缺失填 null 不编造 · 低置信标注"</text>
  <rect x="430" y="442" width="110" height="58" rx="9" fill="#fef2f2" stroke="#fecaca"/>
  <text x="485" y="467" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">放 System</text>
  <text x="485" y="486" text-anchor="middle" font-size="10.5" fill="#ef4444">宁缺勿编</text>

  <text x="240" y="540" text-anchor="middle" font-size="11.5" fill="#64748b">Anthropic 增量添加法：从最小提示开始，</text>
  <text x="240" y="558" text-anchor="middle" font-size="11.5" fill="#64748b">每观测到一种真实失败模式，才加一条针对性规则</text>
  <text x="240" y="586" text-anchor="middle" font-size="11.5" fill="#64748b">（像修线上 bug 一样迭代，拒绝 200 行祈祷式提示词）</text>

  <!-- 分隔 -->
  <line x1="570" y1="100" x2="570" y2="560" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 右：海拔光谱 -->
  <text x="765" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">"正确海拔"光谱（Altitude）</text>

  <line x1="620" y1="140" x2="910" y2="140" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="660" cy="140" r="9" fill="#dc2626"/>
  <circle cx="765" cy="140" r="11" fill="#059669"/>
  <circle cx="880" cy="140" r="9" fill="#2563eb"/>
  <text x="660" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">太低</text>
  <text x="765" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">✓ 刚刚好</text>
  <text x="880" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">太高</text>

  <rect x="600" y="168" width="160" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="612" y="190" font-size="12" font-weight="bold" fill="#b91c1c">太低 = 脆弱逻辑</text>
  <text x="612" y="212" font-size="10.5" fill="#7f1d1d">"如果问A答X，如果问B答Y…"</text>
  <text x="612" y="231" font-size="10.5" fill="#7f1d1d">硬编码 if-else，写不完</text>
  <text x="612" y="250" font-size="10.5" fill="#7f1d1d">"永远恰好输出5条"</text>
  <text x="612" y="278" font-size="10.5" fill="#991b1b">症状：场景一变就崩，</text>
  <text x="612" y="296" font-size="10.5" fill="#991b1b">规则互相打架</text>

  <rect x="770" y="168" width="150" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="782" y="190" font-size="12" font-weight="bold" fill="#2563eb">太高 = 空泛口号</text>
  <text x="782" y="212" font-size="10.5" fill="#1e3a8a">"做一个乐于助人的</text>
  <text x="782" y="230" font-size="10.5" fill="#1e3a8a">好助手"</text>
  <text x="782" y="258" font-size="10.5" fill="#1e40af">症状：说了等于没说，</text>
  <text x="782" y="276" font-size="10.5" fill="#1e40af">输出风格随机</text>
  <text x="782" y="304" font-size="10.5" fill="#1e40af">（对齐训练已内化此类泛化要求）</text>

  <rect x="660" y="336" width="200" height="176" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="674" y="360" font-size="12.5" font-weight="bold" fill="#047857">✓ 刚刚好 = 可操作启发式</text>
  <text x="674" y="384" font-size="11" fill="#065f46">"审查合同时优先检查：</text>
  <text x="674" y="402" font-size="11" fill="#065f46">价格条款与点价机制衔接、</text>
  <text x="674" y="420" font-size="11" fill="#065f46">违约金上限、不可抗力范围。</text>
  <text x="674" y="438" font-size="11" fill="#065f46">发现风险引用原文条款编号，</text>
  <text x="674" y="456" font-size="11" fill="#065f46">按严重程度排序输出。"</text>
  <text x="674" y="486" font-size="10.5" fill="#047857">具体到能指导行为，</text>
  <text x="674" y="504" font-size="10.5" fill="#047857">又不写死到失去弹性</text>

  <text x="765" y="556" text-anchor="middle" font-size="11.5" fill="#475569">配套怪癖见 03 篇正文：重要指令重复、文档在前问题在后、</text>
  <text x="765" y="574" text-anchor="middle" font-size="11.5" fill="#475569">引文接地、输出骨架、标签隔离 —— 每条都有 attention 原理解释</text>
  <text x="765" y="600" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">六件套 = 内容清单，海拔 = 写法刻度，两者合起来就是"提示的解剖学"</text>
</svg>
