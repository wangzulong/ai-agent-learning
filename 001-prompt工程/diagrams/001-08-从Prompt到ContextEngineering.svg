<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">从 Prompt Engineering 到 Context Engineering（07 对比篇）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">PE 打磨一句话 · CE 策展每一轮进窗口的全部 token —— PE 只是 CE 的一个子集</text>

  <defs>
    <marker id="a8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== 左：PE ===== -->
  <rect x="40" y="88" width="280" height="356" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="88" width="280" height="42" rx="12" fill="#475569"/>
  <text x="180" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Prompt Engineering（2020 → 2023）</text>

  <rect x="56" y="142" width="248" height="56" rx="7" fill="#f1f5f9"/>
  <text x="68" y="162" font-size="11.5" fill="#334155">"请扮演一位资深贸易专家，</text>
  <text x="68" y="180" font-size="11.5" fill="#334155">你将收到一封邮件，请抽取……"</text>
  <text x="68" y="193" font-size="9.5" fill="#64748b">↑ 典型形态：咒语式的一句话</text>

  <rect x="56" y="210" width="248" height="34" rx="7" fill="#e2e8f0"/>
  <text x="68" y="231" font-size="11.5" fill="#1e293b">优化对象：提示词文本的措辞</text>
  <rect x="56" y="250" width="248" height="34" rx="7" fill="#e2e8f0"/>
  <text x="68" y="271" font-size="11.5" fill="#1e293b">产出：离散、静态的一段话</text>
  <rect x="56" y="290" width="248" height="34" rx="7" fill="#e2e8f0"/>
  <text x="68" y="311" font-size="11.5" fill="#1e293b">手段：角色扮演 · 魔法词 · few-shot</text>
  <rect x="56" y="330" width="248" height="34" rx="7" fill="#e2e8f0"/>
  <text x="68" y="351" font-size="11.5" fill="#1e293b">迭代：人肉改字 · 凭感觉调</text>

  <rect x="56" y="378" width="248" height="52" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,3"/>
  <rect x="68" y="390" width="106" height="28" rx="5" fill="#dbeafe"/>
  <text x="121" y="408" text-anchor="middle" font-size="10.5" fill="#1e40af">System 指令</text>
  <rect x="182" y="390" width="106" height="28" rx="5" fill="#cffafe"/>
  <text x="235" y="408" text-anchor="middle" font-size="10.5" fill="#155e75">用户消息</text>
  <text x="180" y="434" text-anchor="middle" font-size="10" fill="#64748b">窗口里永远只有这两格</text>

  <!-- ===== 中间：时代推力 ===== -->
  <text x="440" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">Agent 时代到来</text>
  <line x1="332" y1="256" x2="548" y2="256" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#a8)"/>
  <text x="440" y="284" text-anchor="middle" font-size="11" fill="#475569">多轮长任务 · 上下文 4K → 1M token</text>
  <text x="440" y="304" text-anchor="middle" font-size="11" fill="#475569">工具结果 / 检索文档 / 记忆涌入窗口</text>
  <text x="440" y="324" text-anchor="middle" font-size="11" fill="#475569">失败根因从"措辞"变成"窗口里有什么"</text>

  <!-- ===== 右：CE ===== -->
  <rect x="560" y="88" width="360" height="356" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <rect x="560" y="88" width="360" height="42" rx="12" fill="#7c3aed"/>
  <text x="740" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Context Engineering（2025 →）</text>

  <rect x="576" y="142" width="328" height="30" rx="6" fill="#dbeafe"/>
  <text x="588" y="161" font-size="11" font-weight="bold" fill="#1e40af">System 指令</text>
  <text x="892" y="161" text-anchor="end" font-size="9.5" fill="#1d4ed8">稳定 · 可缓存</text>

  <rect x="576" y="176" width="328" height="30" rx="6" fill="#cffafe"/>
  <text x="588" y="195" font-size="11" font-weight="bold" fill="#155e75">工具定义 + 工具返回结果</text>
  <text x="892" y="195" text-anchor="end" font-size="9.5" fill="#0e7490">结果太长先截取</text>

  <rect x="576" y="210" width="328" height="30" rx="6" fill="#d1fae5"/>
  <text x="588" y="229" font-size="11" font-weight="bold" fill="#065f46">RAG 检索片段</text>
  <text x="892" y="229" text-anchor="end" font-size="9.5" fill="#047857">按相关度取舍，不贪多</text>

  <rect x="576" y="244" width="328" height="30" rx="6" fill="#f3e8ff"/>
  <text x="588" y="263" font-size="11" font-weight="bold" fill="#6d28d9">记忆 / 结构化笔记</text>
  <text x="892" y="263" text-anchor="end" font-size="9.5" fill="#6b21a8">跨轮次外置存储</text>

  <rect x="576" y="278" width="328" height="30" rx="6" fill="#ffedd5"/>
  <text x="588" y="297" font-size="11" font-weight="bold" fill="#9a3412">对话历史（压缩后）</text>
  <text x="892" y="297" text-anchor="end" font-size="9.5" fill="#c2410c">compaction 留关键决策</text>

  <rect x="576" y="312" width="328" height="30" rx="6" fill="#f1f5f9"/>
  <text x="588" y="331" font-size="11" font-weight="bold" fill="#334155">用户消息（本轮）</text>
  <text x="892" y="331" text-anchor="end" font-size="9.5" fill="#64748b">关键指令放结尾</text>

  <text x="740" y="366" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b21b6">每一轮都对全部 token 重新策展：增 · 删 · 改 · 排序</text>
  <text x="740" y="388" text-anchor="middle" font-size="11" fill="#6d28d9">方法：compaction 压缩 · sub-agent 隔离 · structured notes 外置</text>
  <text x="740" y="408" text-anchor="middle" font-size="11" fill="#6d28d9">迭代：评估集驱动 · 可自动化（不再是纯手艺活）</text>

  <!-- ===== 底部：三个概念 ===== -->
  <text x="480" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">CE 之所以必要：窗口越大，注意力反而越稀缺</text>

  <rect x="40" y="492" width="280" height="76" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="56" y="514" font-size="12.5" font-weight="bold" fill="#1e40af">attention budget 注意力预算</text>
  <text x="56" y="532" font-size="10.5" fill="#1d4ed8">注意力总量守恒：token 越多，</text>
  <text x="56" y="548" font-size="10.5" fill="#1d4ed8">单个 token 分到的权重越稀</text>

  <rect x="340" y="492" width="280" height="76" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="356" y="514" font-size="12.5" font-weight="bold" fill="#b91c1c">context rot 上下文腐烂</text>
  <text x="356" y="532" font-size="10.5" fill="#991b1b">塞得越多越糊：早期关键信息</text>
  <text x="356" y="548" font-size="10.5" fill="#991b1b">被稀释，模型开始"看丢"细节</text>

  <rect x="640" y="492" width="280" height="76" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="656" y="514" font-size="12.5" font-weight="bold" fill="#15803d">正确海拔（right altitude）</text>
  <text x="656" y="532" font-size="10.5" fill="#166534">以模型需要的粒度给信息：</text>
  <text x="656" y="548" font-size="10.5" fill="#166534">太细被淹没，太粗会失真</text>

  <text x="480" y="604" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">"Prompt Engineering 是 Context Engineering 的子集 —— 措辞仍是技艺，但已不是战场。"</text>
</svg>
