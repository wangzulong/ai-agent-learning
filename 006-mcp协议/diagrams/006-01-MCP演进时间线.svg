<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowGrey" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f8fafc"/>

  <text x="480" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">MCP 演进时间线：从 Anthropic 开源到无状态协议（2024-11 → 2026-07）</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#64748b">考据来源：modelcontextprotocol.io 官方 changelog 与 MCP 官方博客（检索于 2026-09-19）</text>

  <!-- 主轴 -->
  <line x1="60" y1="340" x2="900" y2="340" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowGrey)"/>
  <text x="912" y="344" font-size="10.5" fill="#64748b">时间</text>

  <!-- 事件1：2024-11 上 -->
  <line x1="100" y1="272" x2="100" y2="333" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="100" cy="340" r="7" fill="#2563eb"/>
  <rect x="44" y="140" width="112" height="132" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">2024-11</text>
  <text x="100" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Anthropic</text>
  <text x="100" y="201" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">开源 MCP 协议</text>
  <text x="100" y="224" text-anchor="middle" font-size="10.5" fill="#64748b">spec 2024-11-05</text>
  <text x="100" y="241" text-anchor="middle" font-size="10.5" fill="#64748b">三角色+JSON-RPC</text>
  <text x="100" y="258" text-anchor="middle" font-size="10.5" fill="#64748b">2.0</text>

  <!-- 事件2：2025-03 下 -->
  <line x1="210" y1="347" x2="210" y2="378" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="210" cy="340" r="7" fill="#0891b2"/>
  <rect x="154" y="378" width="112" height="132" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="210" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#0891b2">2025-03</text>
  <text x="210" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">OpenAI 宣布采纳</text>
  <text x="210" y="445" text-anchor="middle" font-size="10.5" fill="#64748b">spec 2025-03-26</text>
  <text x="210" y="462" text-anchor="middle" font-size="10.5" fill="#64748b">HTTP+SSE 支持</text>
  <text x="210" y="479" text-anchor="middle" font-size="10.5" fill="#64748b">远程服务器</text>

  <!-- 事件3：2025-04~05 上 -->
  <line x1="320" y1="272" x2="320" y2="333" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="320" cy="340" r="7" fill="#7c3aed"/>
  <rect x="264" y="140" width="112" height="132" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="320" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">2025-04~05</text>
  <text x="320" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Google 与</text>
  <text x="320" y="201" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Microsoft 采纳</text>
  <text x="320" y="224" text-anchor="middle" font-size="10.5" fill="#64748b">VS Code、Windows</text>
  <text x="320" y="241" text-anchor="middle" font-size="10.5" fill="#64748b">AI Foundry 集成</text>

  <!-- 事件4：2025-06-18 下 -->
  <line x1="430" y1="347" x2="430" y2="378" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="430" cy="340" r="7" fill="#059669"/>
  <rect x="374" y="378" width="112" height="132" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="430" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">2025-06-18</text>
  <text x="430" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Streamable HTTP</text>
  <text x="430" y="439" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">+ OAuth 2.1</text>
  <text x="430" y="462" text-anchor="middle" font-size="10.5" fill="#64748b">取代 HTTP+SSE</text>
  <text x="430" y="479" text-anchor="middle" font-size="10.5" fill="#64748b">企业授权成型</text>

  <!-- 事件5：2025-09-08 上 -->
  <line x1="540" y1="272" x2="540" y2="333" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="540" cy="340" r="7" fill="#2563eb"/>
  <rect x="484" y="140" width="112" height="132" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">2025-09-08</text>
  <text x="540" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">MCP Registry</text>
  <text x="540" y="201" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">官方注册表预览</text>
  <text x="540" y="224" text-anchor="middle" font-size="10.5" fill="#64748b">server.json 格式</text>
  <text x="540" y="241" text-anchor="middle" font-size="10.5" fill="#64748b">协议"应用商店"</text>

  <!-- 事件6：2025-11-25 下 -->
  <line x1="650" y1="347" x2="650" y2="378" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="650" cy="340" r="7" fill="#7c3aed"/>
  <rect x="594" y="378" width="112" height="132" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="650" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">2025-11-25</text>
  <text x="650" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">spec 2025-11-25</text>
  <text x="650" y="445" text-anchor="middle" font-size="10.5" fill="#64748b">Tasks 实验</text>
  <text x="650" y="462" text-anchor="middle" font-size="10.5" fill="#64748b">CIMD / URL 诱导</text>
  <text x="650" y="479" text-anchor="middle" font-size="10.5" fill="#64748b">确认机制</text>

  <!-- 事件7：2025-12 上 -->
  <line x1="760" y1="272" x2="760" y2="333" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="760" cy="340" r="7" fill="#ea580c"/>
  <rect x="704" y="140" width="112" height="132" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="760" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#ea580c">2025-12</text>
  <text x="760" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">捐赠 Linux</text>
  <text x="760" y="201" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">基金会 AAIF</text>
  <text x="760" y="224" text-anchor="middle" font-size="10.5" fill="#64748b">OpenAI/Google/</text>
  <text x="760" y="241" text-anchor="middle" font-size="10.5" fill="#64748b">微软共同支持</text>

  <!-- 事件8：2026-07-28 下 -->
  <line x1="860" y1="347" x2="860" y2="378" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="860" cy="340" r="7" fill="#dc2626"/>
  <rect x="804" y="378" width="112" height="132" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="860" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">2026-07-28</text>
  <text x="860" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">无状态版 spec</text>
  <text x="860" y="445" text-anchor="middle" font-size="10.5" fill="#64748b">移除握手/会话</text>
  <text x="860" y="462" text-anchor="middle" font-size="10.5" fill="#64748b">sampling 弃用</text>
  <text x="860" y="479" text-anchor="middle" font-size="10.5" fill="#64748b">MRTR 新机制</text>

  <!-- 底部总结带 -->
  <rect x="60" y="545" width="840" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="563" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">一年七版：2024-11-05 → 2025-03-26 → 2025-06-18 → 2025-11-25 → 2026-07-28（截至 2026-09 最新）</text>
  <text x="480" y="579" text-anchor="middle" font-size="10.5" fill="#64748b">协议从"有状态双向会话"走向"无状态 HTTP"，SDK 月下载近 5 亿次（官方博客 2026-07）</text>
</svg>
