<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="seqArrow" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="seqArrowBack" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#f8fafc"/>

  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">一次 MCP 调用的完整序列（连接 → 握手 → 发现 → 调用 → 回传）</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#64748b">以 Claude Desktop 查询 CTRM 库存为例（2025-06-18 / 2025-11-25 版协议；2026-07-28 版差异见底部注）</text>

  <!-- 生命线 -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="70" y1="118" x2="70" y2="572"/>
    <line x1="240" y1="118" x2="240" y2="572"/>
    <line x1="420" y1="118" x2="420" y2="572"/>
    <line x1="610" y1="118" x2="610" y2="572"/>
    <line x1="780" y1="118" x2="780" y2="572"/>
  </g>

  <!-- 角色头 -->
  <rect x="20" y="82" width="100" height="34" rx="8" fill="#2563eb"/>
  <text x="70" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">用户</text>
  <rect x="160" y="82" width="160" height="34" rx="8" fill="#2563eb"/>
  <text x="240" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Host（含 MCP Client）</text>
  <rect x="360" y="82" width="120" height="34" rx="8" fill="#7c3aed"/>
  <text x="420" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">模型 LLM</text>
  <rect x="530" y="82" width="160" height="34" rx="8" fill="#059669"/>
  <text x="610" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">MCP Server（库存）</text>
  <rect x="710" y="82" width="140" height="34" rx="8" fill="#ea580c"/>
  <text x="780" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">CTRM MySQL</text>

  <!-- 阶段A：连接与发现 -->
  <rect x="40" y="105" width="880" height="140" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="52" y="126" font-size="11.5" font-weight="bold" fill="#2563eb">阶段 ①② 连接与发现（stdio 子进程或 HTTP 连接建立后）</text>

  <line x1="240" y1="152" x2="602" y2="152" stroke="#2563eb" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="425" y="146" text-anchor="middle" font-size="10.5" fill="#0f172a">① initialize（版本 + 能力协商）</text>
  <line x1="610" y1="180" x2="248" y2="180" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seqArrowBack)"/>
  <text x="425" y="174" text-anchor="middle" font-size="10.5" fill="#64748b">← serverInfo + capabilities + instructions</text>
  <line x1="240" y1="208" x2="602" y2="208" stroke="#2563eb" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="425" y="202" text-anchor="middle" font-size="10.5" fill="#0f172a">② tools/list 工具发现</text>
  <line x1="610" y1="236" x2="248" y2="236" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seqArrowBack)"/>
  <text x="425" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">← 工具清单 + inputSchema（含 readOnlyHint 注解）</text>

  <!-- 阶段B：一次真实调用 -->
  <rect x="40" y="255" width="880" height="310" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="52" y="276" font-size="11.5" font-weight="bold" fill="#059669">阶段 ③~⑧ 一次真实调用（"上海仓 CU-2026 还有多少铜？"）</text>

  <line x1="70" y1="300" x2="232" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="155" y="294" text-anchor="middle" font-size="10.5" fill="#0f172a">③ 提问：SH 仓库存？</text>
  <line x1="240" y1="328" x2="412" y2="328" stroke="#2563eb" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="330" y="322" text-anchor="middle" font-size="10.5" fill="#0f172a">④ 问题 + 工具清单（Schema 译成 function 定义）</text>
  <line x1="420" y1="356" x2="248" y2="356" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seqArrowBack)"/>
  <text x="330" y="350" text-anchor="middle" font-size="10.5" fill="#64748b">← 决策：调 query_inventory</text>
  <line x1="240" y1="384" x2="602" y2="384" stroke="#2563eb" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="425" y="378" text-anchor="middle" font-size="10.5" fill="#0f172a">⑤ tools/call(SH, CU-2026)（用户已审批）</text>
  <line x1="610" y1="412" x2="772" y2="412" stroke="#059669" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="695" y="406" text-anchor="middle" font-size="10.5" fill="#0f172a">⑥ 参数化 SQL（只读账号）</text>
  <line x1="780" y1="440" x2="618" y2="440" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seqArrowBack)"/>
  <text x="695" y="434" text-anchor="middle" font-size="10.5" fill="#64748b">← 总量 1200 / 可用 950 吨</text>
  <line x1="610" y1="468" x2="248" y2="468" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seqArrowBack)"/>
  <text x="425" y="462" text-anchor="middle" font-size="10.5" fill="#64748b">← result.content（isError=false）</text>
  <line x1="240" y1="496" x2="412" y2="496" stroke="#2563eb" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="330" y="490" text-anchor="middle" font-size="10.5" fill="#0f172a">⑦ 结果回填上下文</text>
  <line x1="420" y1="524" x2="248" y2="524" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seqArrowBack)"/>
  <text x="330" y="518" text-anchor="middle" font-size="10.5" fill="#64748b">← 生成最终回答文本</text>
  <line x1="240" y1="552" x2="78" y2="552" stroke="#2563eb" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="155" y="546" text-anchor="middle" font-size="10.5" fill="#0f172a">⑧ 回答：1200 吨 / 可用 950 吨</text>

  <!-- 底部注 -->
  <rect x="40" y="582" width="880" height="44" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="480" y="600" text-anchor="middle" font-size="10.5" fill="#dc2626">版本注：握手与会话属 2025-06-18 / 2025-11-25 版；2026-07-28 版已移除 initialize 与 Mcp-Session-Id，版本/能力随每请求 _meta 自带，新增 server/discover</text>
  <text x="480" y="618" text-anchor="middle" font-size="10.5" fill="#dc2626">容错注：工具执行失败 ≠ 协议错误 —— isError=true + 错误文本回模型，模型可自行改参数重试（Agent 自我纠正的关键）</text>
</svg>
