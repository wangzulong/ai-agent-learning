<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="620" fill="#f8fafc"/>

  <text x="480" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">MCP 核心概念地图</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#64748b">消息层 / 角色 / 三原语 / 传输 / 辅助机制 / 生态 —— 12 张概念卡的关系总览（对应 02-概念篇）</text>

  <!-- 连线（卫星 → 中心） -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="280" y1="235" x2="400" y2="315"/>
    <line x1="280" y1="375" x2="400" y2="345"/>
    <line x1="480" y1="168" x2="480" y2="298"/>
    <line x1="680" y1="240" x2="565" y2="320"/>
    <line x1="680" y1="400" x2="565" y2="350"/>
    <line x1="350" y1="512" x2="440" y2="372"/>
    <line x1="620" y1="512" x2="525" y2="372"/>
  </g>

  <!-- 中心节点 -->
  <rect x="400" y="298" width="160" height="74" rx="12" fill="#2563eb"/>
  <text x="480" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">MCP 协议</text>
  <text x="480" y="352" text-anchor="middle" font-size="10" fill="#dbeafe">Model Context Protocol</text>

  <!-- 消息层 -->
  <rect x="390" y="110" width="180" height="60" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">JSON-RPC 2.0 消息层</text>
  <text x="480" y="155" text-anchor="middle" font-size="10.5" fill="#64748b">request / response / notification</text>

  <!-- Host 卡 -->
  <rect x="110" y="180" width="170" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="205" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">Host 宿主应用</text>
  <text x="195" y="225" text-anchor="middle" font-size="10.5" fill="#64748b">用户面前的 AI 应用</text>
  <text x="195" y="242" text-anchor="middle" font-size="10.5" fill="#64748b">权限 · 审批 · UI 的归属地</text>
  <rect x="130" y="252" width="130" height="24" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="195" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2563eb">内含 MCP Client ×N</text>

  <!-- Server 卡 -->
  <rect x="110" y="320" width="170" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="195" y="345" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">MCP Server 服务方</text>
  <text x="195" y="365" text-anchor="middle" font-size="10.5" fill="#64748b">把数据库/API/文件包成协议</text>
  <rect x="130" y="378" width="130" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="195" y="394" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">例：ctrm-inventory</text>

  <!-- 三原语卡 -->
  <rect x="680" y="150" width="210" height="180" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="785" y="175" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0891b2">三原语（谁能触发？）</text>
  <rect x="695" y="188" width="180" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="785" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">tools 工具 —— 模型可控</text>
  <text x="785" y="217" text-anchor="middle" font-size="9.5" fill="#64748b">有副作用的动作 / 参数化查询</text>
  <rect x="695" y="232" width="180" height="36" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
  <text x="785" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#0891b2">resources 资源 —— 应用可控</text>
  <text x="785" y="261" text-anchor="middle" font-size="9.5" fill="#64748b">只读上下文数据 / URI 定位</text>
  <rect x="695" y="276" width="180" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="785" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">prompts 模板 —— 用户可控</text>
  <text x="785" y="305" text-anchor="middle" font-size="9.5" fill="#64748b">预置标准化问法 / 可复用</text>

  <!-- 注解与Registry -->
  <rect x="680" y="360" width="210" height="100" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="785" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#ea580c">注解 与 Registry</text>
  <text x="785" y="407" text-anchor="middle" font-size="10.5" fill="#64748b">readOnlyHint 等风险标签（Hint）</text>
  <text x="785" y="425" text-anchor="middle" font-size="10.5" fill="#64748b">官方注册表（2025-09 预览）</text>
  <text x="785" y="443" text-anchor="middle" font-size="10.5" fill="#64748b">server.json / .well-known 发现</text>

  <!-- 传输层 -->
  <rect x="110" y="470" width="280" height="100" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="250" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">传输层（消息走什么线）</text>
  <rect x="128" y="508" width="118" height="26" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="187" y="525" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2563eb">stdio 本地子进程</text>
  <rect x="254" y="508" width="118" height="26" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="313" y="525" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">Streamable HTTP</text>
  <text x="250" y="556" text-anchor="middle" font-size="10.5" fill="#64748b">本地快免网络 · 远程可加 OAuth 与负载均衡</text>

  <!-- 辅助机制 -->
  <rect x="470" y="470" width="330" height="100" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="635" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">辅助机制（含 2026 版变化）</text>
  <text x="635" y="517" text-anchor="middle" font-size="10.5" fill="#64748b">initialize 握手与能力协商（2026-07-28 已移除）</text>
  <text x="635" y="535" text-anchor="middle" font-size="10.5" fill="#64748b">sampling 反向用 Host LLM / roots 边界（均已弃用）</text>
  <text x="635" y="553" text-anchor="middle" font-size="10.5" fill="#64748b">notifications 变更推送 · elicitation 人工确认</text>

  <!-- 底部速记 -->
  <text x="480" y="600" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#64748b">速记：tools=模型 · resources=应用 · prompts=用户 ｜ 消息=JSON-RPC 2.0 ｜ 传输=stdio / Streamable HTTP</text>
</svg>
