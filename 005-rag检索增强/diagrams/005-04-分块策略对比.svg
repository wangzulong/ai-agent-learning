<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="600" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">分块策略对比：固定 / 递归 / 语义 / 父子块</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#64748b">切块是 RAG 第一杠杆 —— 检索效果差，先查切块再调别的</text>

  <!-- 列1 固定分块 -->
  <rect x="38" y="88" width="212" height="420" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="38" y="88" width="212" height="32" rx="10" fill="#2563eb"/>
  <rect x="38" y="104" width="212" height="16" fill="#2563eb"/>
  <text x="144" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">固定分块</text>
  <rect x="58" y="130" width="192" height="86" rx="6" fill="#f1f5f9"/>
  <rect x="62" y="150" width="54" height="50" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="122" y="150" width="54" height="50" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="182" y="150" width="54" height="50" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="149" y1="138" x2="149" y2="208" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="144" y="240" text-anchor="middle" font-size="11" fill="#0f172a">每 N 字切一刀，快，</text>
  <text x="144" y="258" text-anchor="middle" font-size="11" fill="#0f172a">但会切断句子（红线处）</text>
  <text x="52" y="290" font-size="11" font-weight="bold" fill="#059669">优点</text>
  <text x="52" y="308" font-size="10.5" fill="#334155">实现最简单、速度最快</text>
  <text x="52" y="336" font-size="11" font-weight="bold" fill="#dc2626">缺点</text>
  <text x="52" y="354" font-size="10.5" fill="#334155">切断语义；表格全毁</text>
  <text x="52" y="382" font-size="11" font-weight="bold" fill="#2563eb">适用</text>
  <text x="52" y="400" font-size="10.5" fill="#334155">粗糙原型、日志类文本</text>
  <rect x="90" y="440" width="108" height="30" rx="15" fill="#dbeafe"/>
  <text x="144" y="460" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">快糙猛 · 仅起步</text>

  <!-- 列2 递归分块 -->
  <rect x="262" y="88" width="212" height="420" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="262" y="88" width="212" height="32" rx="10" fill="#059669"/>
  <rect x="262" y="104" width="212" height="16" fill="#059669"/>
  <text x="368" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">递归分块</text>
  <rect x="404" y="92" width="44" height="18" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="426" y="105" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">推荐</text>
  <rect x="282" y="130" width="192" height="86" rx="6" fill="#f1f5f9"/>
  <rect x="290" y="150" width="56" height="50" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <rect x="351" y="150" width="60" height="50" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <rect x="416" y="150" width="50" height="50" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="368" y="240" text-anchor="middle" font-size="11" fill="#0f172a">按段落→句子→分号</text>
  <text x="368" y="258" text-anchor="middle" font-size="11" fill="#0f172a">逐级降级下刀，贴语义</text>
  <text x="276" y="290" font-size="11" font-weight="bold" fill="#059669">优点</text>
  <text x="276" y="308" font-size="10.5" fill="#334155">贴近语义边界；参数直观</text>
  <text x="276" y="336" font-size="11" font-weight="bold" fill="#dc2626">缺点</text>
  <text x="276" y="354" font-size="10.5" fill="#334155">size / overlap 需要调参</text>
  <text x="276" y="382" font-size="11" font-weight="bold" fill="#2563eb">适用</text>
  <text x="276" y="400" font-size="10.5" fill="#334155">绝大多数文档（默认首选）</text>
  <rect x="314" y="440" width="108" height="30" rx="15" fill="#d1fae5"/>
  <text x="368" y="460" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065f46">默认首选</text>

  <!-- 列3 语义分块 -->
  <rect x="486" y="88" width="212" height="420" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="486" y="88" width="212" height="32" rx="10" fill="#7c3aed"/>
  <rect x="486" y="104" width="212" height="16" fill="#7c3aed"/>
  <text x="592" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">语义分块</text>
  <rect x="506" y="130" width="192" height="86" rx="6" fill="#f1f5f9"/>
  <rect x="514" y="144" width="58" height="46" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="577" y="158" width="62" height="46" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="644" y="148" width="46" height="50" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="592" y="240" text-anchor="middle" font-size="11" fill="#0f172a">相邻句相似度骤降处</text>
  <text x="592" y="258" text-anchor="middle" font-size="11" fill="#0f172a">下刀（错位=语义边界）</text>
  <text x="500" y="290" font-size="11" font-weight="bold" fill="#059669">优点</text>
  <text x="500" y="308" font-size="10.5" fill="#334155">块内语义最完整</text>
  <text x="500" y="336" font-size="11" font-weight="bold" fill="#dc2626">缺点</text>
  <text x="500" y="354" font-size="10.5" fill="#334155">索引成本高、速度慢</text>
  <text x="500" y="382" font-size="11" font-weight="bold" fill="#2563eb">适用</text>
  <text x="500" y="400" font-size="10.5" fill="#334155">高质量长文、论文报告</text>
  <rect x="538" y="440" width="108" height="30" rx="15" fill="#ede9fe"/>
  <text x="592" y="460" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5b21b6">质量优先</text>

  <!-- 列4 父子块 -->
  <rect x="710" y="88" width="212" height="420" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="710" y="88" width="212" height="32" rx="10" fill="#ea580c"/>
  <rect x="710" y="104" width="212" height="16" fill="#ea580c"/>
  <text x="816" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">父子块检索</text>
  <rect x="730" y="130" width="192" height="86" rx="6" fill="#f1f5f9"/>
  <rect x="744" y="140" width="164" height="24" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="826" y="156" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a3412">父块（喂给 LLM）</text>
  <line x1="769" y1="164" x2="769" y2="184" stroke="#cbd5e1" stroke-width="1.2" fill="none"/>
  <line x1="826" y1="164" x2="826" y2="184" stroke="#cbd5e1" stroke-width="1.2" fill="none"/>
  <line x1="883" y1="164" x2="883" y2="184" stroke="#cbd5e1" stroke-width="1.2" fill="none"/>
  <rect x="744" y="184" width="50" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="800" y="184" width="50" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="856" y="184" width="50" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="769" y="201" text-anchor="middle" font-size="10.5" fill="#1e40af">子块</text>
  <text x="825" y="201" text-anchor="middle" font-size="10.5" fill="#1e40af">子块</text>
  <text x="881" y="201" text-anchor="middle" font-size="10.5" fill="#1e40af">子块</text>
  <text x="816" y="240" text-anchor="middle" font-size="11" fill="#0f172a">小块负责检索，</text>
  <text x="816" y="258" text-anchor="middle" font-size="11" fill="#0f172a">大块负责生成</text>
  <text x="724" y="290" font-size="11" font-weight="bold" fill="#059669">优点</text>
  <text x="724" y="308" font-size="10.5" fill="#334155">检索准 + 上下文足</text>
  <text x="724" y="336" font-size="11" font-weight="bold" fill="#dc2626">缺点</text>
  <text x="724" y="354" font-size="10.5" fill="#334155">索引结构复杂，实现重</text>
  <text x="724" y="382" font-size="11" font-weight="bold" fill="#2563eb">适用</text>
  <text x="724" y="400" font-size="10.5" fill="#334155">操作手册、合同条款</text>
  <rect x="758" y="440" width="116" height="30" rx="15" fill="#ffedd5"/>
  <text x="816" y="460" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a3412">手册 / 条款类</text>

  <text x="480" y="548" text-anchor="middle" font-size="11" fill="#64748b">参数起点（中文）：chunk 400~600 字 · overlap 50~100 字 · 分隔符 [段落, 句号, 分号] —— 详见 02 概念篇卡 02 / 03 原理篇</text>
</svg>
