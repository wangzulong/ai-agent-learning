  <text x="352" y="532" font-size="10.5" fill="#334155">119B/6B·欧盟合规选项</text>

  <!-- 底部解读 -->
  <rect x="36" y="580" width="888" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="600" font-size="12.5" font-weight="bold" fill="#0f172a">三条选型主线（详见 07 对比篇）：</text>
  <text x="56" y="620" font-size="11.5" fill="#475569">① 闭源 API 省心、按量付费，适合绝大多数团队起步；② DeepSeek/Qwen 开源权重=数据主权+成本可控，国产合规友好；③ MoE（总参大/激活小）已是 2026 主流架构，1M 上下文成为旗舰标配。</text>
