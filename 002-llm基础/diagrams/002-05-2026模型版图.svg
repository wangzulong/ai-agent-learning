<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">2026-09 大模型版图：闭源三强 × 开源四杰</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">横轴：获取方式（自托管开放权重 ↔ 云 API）· 纵轴：性价比优先 ↔ 能力优先 · 气泡标注价格（$/1M token，输入/输出）</text>

  <!-- 坐标区 -->
