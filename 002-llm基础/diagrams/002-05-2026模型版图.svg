  <line x1="470" y1="84" x2="470" y2="564" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="90" y1="324" x2="850" y2="324" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="838" y="106" font-size="12" font-weight="bold" fill="#334155">闭源 API（花钱省心）</text>
