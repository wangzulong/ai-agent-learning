<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="680" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">LLM 技术栈分层全景</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">自上而下：你的业务 → 模型的出厂流水线；右侧标注 002 笔记对应篇章</text>

  <!-- 应用层 -->
  <rect x="50" y="84" width="560" height="62" rx="10" fill="#2563eb"/>
  <text x="78" y="112" font-size="17" font-weight="bold" fill="#ffffff">① 应用层</text>
  <text x="78" y="134" font-size="12.5" fill="#dbeafe">AI Agent · RAG 问答 · 智能客服 · Copilot · 业务抽取</text>
  <rect x="630" y="84" width="290" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="648" y="112" font-size="12.5" font-weight="bold" fill="#1d4ed8">003 Agent原理 · 005 RAG · 010 项目实战</text>
  <text x="648" y="132" font-size="11.5" fill="#3b82f6">模型之上的一切工程</text>

  <!-- 编排层 -->
  <rect x="50" y="158" width="560" height="62" rx="10" fill="#7c3aed"/>
  <text x="78" y="186" font-size="17" font-weight="bold" fill="#ffffff">② 编排层（可选）</text>
  <text x="78" y="208" font-size="12.5" fill="#ede9fe">LangGraph · OpenAI Agents SDK · Claude Agent SDK · 自研循环</text>
  <rect x="630" y="158" width="290" height="62" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="648" y="186" font-size="12.5" font-weight="bold" fill="#6d28d9">009 框架实战 · 007 多Agent系统</text>
  <text x="648" y="206" font-size="11.5" fill="#8b5cf6">决定"谁在什么时候调模型"</text>

  <!-- 上下文层 -->
  <rect x="50" y="232" width="560" height="62" rx="10" fill="#0891b2"/>
  <text x="78" y="260" font-size="17" font-weight="bold" fill="#ffffff">③ 提示与上下文工程层</text>
  <text x="78" y="282" font-size="12.5" fill="#cffafe">System Prompt · Few-shot · 工具定义 · 检索内容 · 历史消息 · 记忆</text>
  <rect x="630" y="232" width="290" height="62" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="648" y="260" font-size="12.5" font-weight="bold" fill="#0e7490">001 Prompt工程 · 008 记忆与上下文</text>
  <text x="648" y="280" font-size="11.5" fill="#06b6d4">决定"模型每一轮看到什么"</text>

  <!-- 服务层 -->
  <rect x="50" y="306" width="560" height="62" rx="10" fill="#059669"/>
  <text x="78" y="334" font-size="17" font-weight="bold" fill="#ffffff">④ 模型服务层</text>
  <text x="78" y="356" font-size="12.5" fill="#d1fae5">推理 API（OpenAI/Anthropic/DeepSeek）· vLLM/Ollama 自部署 · 网关/路由/缓存</text>
  <rect x="630" y="306" width="290" height="62" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="648" y="334" font-size="12.5" font-weight="bold" fill="#047857">05 实战篇 · 06 生产篇（本目录）</text>
  <text x="648" y="354" font-size="11.5" fill="#10b981">调用、计费、延迟、缓存都在这层</text>

  <!-- 模型层 -->
  <rect x="50" y="380" width="560" height="62" rx="10" fill="#ea580c"/>
  <text x="78" y="408" font-size="17" font-weight="bold" fill="#ffffff">⑤ 模型层</text>
  <text x="78" y="430" font-size="12.5" fill="#ffedd5">Transformer Decoder · MoE 专家路由 · 多模态编码器 · 思考模式</text>
  <rect x="630" y="380" width="290" height="62" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="648" y="408" font-size="12.5" font-weight="bold" fill="#c2410c">02 概念篇 · 03 原理篇 · 07 格局篇</text>
  <text x="648" y="428" font-size="11.5" fill="#f97316">本目录核心：模型内部发生什么</text>

  <!-- 训练层 -->
  <rect x="50" y="454" width="560" height="62" rx="10" fill="#dc2626"/>
  <text x="78" y="482" font-size="17" font-weight="bold" fill="#ffffff">⑥ 训练层（模型厂商的流水线）</text>
  <text x="78" y="504" font-size="12.5" fill="#fee2e2">预训练（万亿token）→ SFT 指令微调 → RLHF / DPO / R1式强化学习</text>
  <rect x="630" y="454" width="290" height="62" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="648" y="482" font-size="12.5" font-weight="bold" fill="#b91c1c">04 进阶篇（本目录）</text>
  <text x="648" y="502" font-size="11.5" fill="#ef4444">模型为什么"听话、聪明"</text>

  <!-- 硬件层 -->
  <rect x="50" y="528" width="560" height="62" rx="10" fill="#64748b"/>
  <text x="78" y="556" font-size="17" font-weight="bold" fill="#ffffff">⑦ 硬件与算力层</text>
  <text x="78" y="578" font-size="12.5" fill="#e2e8f0">GPU/TPU 集群 · 显存带宽 · KV Cache 显存占用 · 量化（INT8/INT4）</text>
  <rect x="630" y="528" width="290" height="62" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="648" y="556" font-size="12.5" font-weight="bold" fill="#475569">03 篇 KV Cache · 06 篇成本</text>
  <text x="648" y="576" font-size="11.5" fill="#64748b">一切成本的物理来源</text>

  <!-- 底部注释 -->
  <rect x="50" y="612" width="870" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="70" y="632" font-size="12.5" font-weight="bold" fill="#0f172a">工程师的视角（本笔记立场）：</text>
  <text x="70" y="651" font-size="12" fill="#475569">① ② ③ 层是你写代码的地方；④ 层是你花钱的地方；⑤ ⑥ 层是你必须懂原理才能用好 ④ 的地方。</text>
</svg>
