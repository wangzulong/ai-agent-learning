<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">自回归生成循环 与 KV Cache（推理提速的关键）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">左：生成的循环结构 · 右：KV Cache 为什么能把每步计算量砍掉一个数量级</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== 左：生成循环 ===== -->
  <rect x="36" y="84" width="420" height="430" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="246" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">生成循环（Decode 阶段）</text>

  <rect x="76" y="132" width="340" height="52" rx="8" fill="#0ea5e9"/>
  <text x="246" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Prompt 预填充（Prefill）</text>
  <text x="246" y="173" text-anchor="middle" font-size="11.5" fill="#e0f2fe">一次性并行算完整个输入提示</text>

  <line x1="246" y1="184" x2="246" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="76" y="214" width="340" height="52" rx="8" fill="#ea580c"/>
  <text x="246" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">前向计算（只算最后一个位置）</text>
  <text x="246" y="255" text-anchor="middle" font-size="11.5" fill="#ffedd5">注意力查全部历史 → 预测下一个 token</text>

  <line x1="246" y1="266" x2="246" y2="294" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="76" y="296" width="340" height="52" rx="8" fill="#16a34a"/>
  <text x="246" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">采样出 1 个 token</text>
  <text x="246" y="337" text-anchor="middle" font-size="11.5" fill="#dcfce7">temperature / top_p 决定掷骰子方式</text>

  <line x1="246" y1="348" x2="246" y2="376" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="76" y="378" width="340" height="52" rx="8" fill="#7c3aed"/>
  <text x="246" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">拼回序列，继续下一轮</text>
  <text x="246" y="419" text-anchor="middle" font-size="11.5" fill="#ede9fe">直到输出终止符 / 达到 max_tokens</text>

  <path d="M 246 430 L 246 452 L 60 452 L 60 240 L 76 240" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#a3)"/>
  <text x="152" y="470" font-size="11.5" fill="#b91c1c">循环 N 次 = 回答有 N 个 token</text>
  <text x="76" y="498" font-size="11.5" fill="#64748b">为什么逐字输出（流式）是天然的？因为真的是逐字算的。</text>

  <!-- ===== 右：KV Cache 对比 ===== -->
  <rect x="480" y="84" width="450" height="430" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="705" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">第 100 步生成时，注意力要"查历史"</text>

  <!-- 无 cache -->
  <rect x="502" y="132" width="406" height="168" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="522" y="158" font-size="14" font-weight="bold" fill="#b91c1c">✗ 无 KV Cache：每步全部重算</text>
  <rect x="522" y="172" width="360" height="26" rx="5" fill="#fecaca"/>
  <text x="702" y="190" text-anchor="middle" font-size="11.5" fill="#7f1d1d">历史 99 个 token 的 K、V 全部重算一遍</text>
  <rect x="522" y="206" width="360" height="26" rx="5" fill="#fecaca"/>
  <text x="702" y="224" text-anchor="middle" font-size="11.5" fill="#7f1d1d">第 200 步又要重算 199 个 …… 重复劳动爆炸</text>
  <rect x="522" y="240" width="360" height="26" rx="5" fill="#fee2e2"/>
  <text x="702" y="258" text-anchor="middle" font-size="11.5" fill="#991b1b">总计算量随输出长度 ≈ 平方增长</text>
  <text x="522" y="290" font-size="11.5" fill="#991b1b">相当于每次翻书都把整本书重新抄一遍再查</text>

  <!-- 有 cache -->
  <rect x="502" y="316" width="406" height="168" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="522" y="342" font-size="14" font-weight="bold" fill="#047857">✓ 有 KV Cache：历史算一次，存起来</text>
  <rect x="522" y="356" width="360" height="26" rx="5" fill="#a7f3d0"/>
  <text x="702" y="374" text-anchor="middle" font-size="11.5" fill="#064e3b">Prefill 时把每个 token 的 K、V 算好放进显存</text>
  <rect x="522" y="390" width="360" height="26" rx="5" fill="#a7f3d0"/>
  <text x="702" y="408" text-anchor="middle" font-size="11.5" fill="#064e3b">之后每步只算"新 token"的 K、V，追加进缓存</text>
  <rect x="522" y="424" width="360" height="26" rx="5" fill="#d1fae5"/>
  <text x="702" y="442" text-anchor="middle" font-size="11.5" fill="#065f46">每步计算量从 O(全部历史) 降到 O(1 个新 token)</text>
  <text x="522" y="474" font-size="11.5" fill="#065f46">把书抄在便利贴上贴在手边，随用随取</text>

  <text x="480" y="540" text-anchor="middle" font-size="12.5" fill="#475569">代价：KV Cache 要占显存（与上下文长度成正比）——这就是"长上下文=贵"的物理原因，也是 Prompt Caching 能省钱的原因（前缀的 K/V 复用，不用重算）</text>
</svg>
