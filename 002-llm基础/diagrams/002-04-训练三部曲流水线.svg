<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="580" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">训练三部曲：从"会说话"到"听指令、讲武德"</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">一个能用于生产的模型 = 预训练打底 + 指令微调教会做事 + 对齐训练教会规矩（思考模型还有第四步）</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 阶段 1 预训练 -->
  <rect x="36" y="88" width="280" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="36" y="88" width="280" height="46" rx="12" fill="#dc2626"/>
  <text x="176" y="117" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">① 预训练（Pre-training）</text>
  <text x="56" y="162" font-size="12.5" font-weight="bold" fill="#0f172a">输入：互联网级语料</text>
  <text x="56" y="182" font-size="11.5" fill="#475569">网页/书/代码，数万亿 token（V4-Pro 用了 33T）</text>
  <text x="56" y="216" font-size="12.5" font-weight="bold" fill="#0f172a">目标：下一个词预测</text>
  <text x="56" y="236" font-size="11.5" fill="#475569">给前文，猜下一个 token，猜错就调权重</text>
  <text x="56" y="270" font-size="12.5" font-weight="bold" fill="#0f172a">产物：基座模型（Base Model）</text>
  <text x="56" y="290" font-size="11.5" fill="#475569">知识渊博的"接龙机器"，不会对话</text>
  <text x="56" y="324" font-size="12.5" font-weight="bold" fill="#0f172a">成本占比：~99% 算力</text>
  <text x="56" y="344" font-size="11.5" fill="#475569">数月 · 数千卡 · 数千万美元级</text>
  <rect x="56" y="372" width="240" height="72" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="66" y="394" font-size="11.5" font-weight="bold" fill="#b91c1c">类比：让婴儿通读全世界的书</text>
  <text x="66" y="414" font-size="11" fill="#991b1b">满腹经纶，但你问他问题，</text>
  <text x="66" y="431" font-size="11" fill="#991b1b">他只会接着你的话说，不会"回答"</text>

  <line x1="316" y1="278" x2="346" y2="278" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a4)"/>

  <!-- 阶段 2 SFT -->
  <rect x="348" y="88" width="280" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="348" y="88" width="280" height="46" rx="12" fill="#ea580c"/>
  <text x="488" y="117" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">② 指令微调（SFT）</text>
  <text x="368" y="162" font-size="12.5" font-weight="bold" fill="#0f172a">输入：人工标注的指令对</text>
  <text x="368" y="182" font-size="11.5" fill="#475569">几万~百万条（指令 → 高质量回答）</text>
  <text x="368" y="216" font-size="12.5" font-weight="bold" fill="#0f172a">目标：学会"对话格式"</text>
  <text x="368" y="236" font-size="11.5" fill="#475569">把用户输入当【指令】执行，而非【文本】续写</text>
  <text x="368" y="270" font-size="12.5" font-weight="bold" fill="#0f172a">产物：Instruct / Chat 模型</text>
  <text x="368" y="290" font-size="11.5" fill="#475569">能听懂 system/user 角色的助手</text>
  <text x="368" y="324" font-size="12.5" font-weight="bold" fill="#0f172a">成本占比：~1% 算力</text>
  <text x="368" y="344" font-size="11.5" fill="#475569">但决定模型"会不会用"，性价比极高</text>
  <rect x="368" y="372" width="240" height="72" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="378" y="394" font-size="11.5" font-weight="bold" fill="#c2410c">类比：入职培训——教员工</text>
  <text x="378" y="414" font-size="11" fill="#9a3412">"客户提需求时该进入工作模式，</text>
  <text x="378" y="431" font-size="11" fill="#9a3412">而不是跟着客户一起闲聊"</text>

  <line x1="628" y1="278" x2="658" y2="278" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a4)"/>

  <!-- 阶段 3 对齐 -->
  <rect x="660" y="88" width="264" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="660" y="88" width="264" height="46" rx="12" fill="#7c3aed"/>
  <text x="792" y="117" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">③ 偏好对齐（Alignment）</text>
  <text x="680" y="160" font-size="12.5" font-weight="bold" fill="#0f172a">主流技术路线：</text>
  <text x="680" y="181" font-size="11.5" fill="#475569">· RLHF：人类对回答排好坏 → 训练奖励模型 → 强化学习优化</text>
  <text x="680" y="200" font-size="11.5" fill="#475569">· DPO：直接从偏好对学习，跳过奖励模型</text>
  <text x="680" y="219" font-size="11.5" fill="#475569">· R1式 RL：可验证任务（数学/代码）上纯强化学习，逼出长思考</text>
  <text x="680" y="253" font-size="12.5" font-weight="bold" fill="#0f172a">产物：对齐后的助手</text>
  <text x="680" y="273" font-size="11.5" fill="#475569">有用、诚实、无害；推理模型在此阶段练出"思考链"</text>
  <text x="680" y="307" font-size="12.5" font-weight="bold" fill="#0f172a">对工程师的意义：</text>
  <text x="680" y="327" font-size="11.5" fill="#475569">指令遵循（prompt 有效的前提）、</text>
  <text x="680" y="346" font-size="11.5" fill="#475569">拒答行为、格式偏好都是这一步塑形的</text>
  <rect x="680" y="372" width="224" height="72" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="690" y="394" font-size="11.5" font-weight="bold" fill="#6d28d9">类比：绩效与价值观培训</text>
  <text x="690" y="414" font-size="11" fill="#5b21b6">"这样回答客户打五星，</text>
  <text x="690" y="431" font-size="11" fill="#5b21b6">那样回答会挨投诉"</text>

  <!-- 底部要点 -->
  <rect x="36" y="492" width="888" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="516" font-size="13" font-weight="bold" fill="#0f172a">为什么这决定你写提示词的方式：</text>
  <text x="56" y="540" font-size="12" fill="#475569">SFT + 对齐让"清晰指令会被服从"成为默认行为 → 所以 001 篇说"提示是触发训练好的行为，不是教模型新东西"；思考模型的 RL 训练让"只给目标不给步骤"成为更优交互。</text>
</svg>
