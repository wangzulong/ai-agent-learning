<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowE" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowEV" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowER" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowEG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#f8fafc"/>

  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">项目 06 架构：点价评审小组（007 多 Agent：主管 + 三 Worker）</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#64748b">复用 01 抽取服务 + 03 邮件触发 ｜ 汇总裁决走代码规则，主管 LLM 只写建议书</text>

  <!-- 入口 -->
  <rect x="40" y="100" width="180" height="100" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="40" y="100" width="180" height="28" rx="10" fill="#0891b2"/><rect x="40" y="116" width="180" height="12" fill="#0891b2"/>
  <text x="130" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">任务入口（复用 03）</text>
  <text x="54" y="150" font-size="10.5" fill="#0f172a">点价邮件分流后转发</text>
  <text x="54" y="170" font-size="10.5" fill="#0f172a">或 Vue 页面手动提交</text>
  <text x="54" y="192" font-size="10" fill="#64748b">要素来自 01 /extract 服务</text>

  <!-- 主管 -->
  <rect x="330" y="90" width="240" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="330" y="90" width="240" height="30" rx="10" fill="#7c3aed"/><rect x="330" y="108" width="240" height="12" fill="#7c3aed"/>
  <text x="450" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">主管 Agent（Supervisor）</text>
  <text x="344" y="142" font-size="10.5" fill="#0f172a">解析任务 → 拆三份评审简报</text>
  <text x="344" y="162" font-size="10.5" fill="#0f172a">并行分发 → 回收意见</text>
  <text x="344" y="182" font-size="10.5" fill="#0f172a">识别分歧 → 生成裁决建议书</text>
  <text x="344" y="202" font-size="10" fill="#dc2626">红线：不改变流程判定结果</text>

  <line x1="220" y1="150" x2="324" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowE)"/>

  <!-- 三 Worker 并行 -->
  <rect x="150" y="270" width="200" height="140" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="150" y="270" width="200" height="28" rx="10" fill="#2563eb"/><rect x="150" y="286" width="200" height="12" fill="#2563eb"/>
  <text x="250" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">交易 Agent</text>
  <text x="164" y="318" font-size="10.5" fill="#0f172a">基差 vs 近期均值</text>
  <text x="164" y="338" font-size="10.5" fill="#0f172a">偏离 &gt;50 元/吨 提示风险</text>
  <text x="164" y="362" font-size="10" fill="#64748b">依据：期货价工具</text>
  <text x="164" y="386" font-size="10" fill="#dc2626">evidence 强制非空</text>

  <rect x="380" y="270" width="200" height="140" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="380" y="270" width="200" height="28" rx="10" fill="#dc2626"/><rect x="380" y="286" width="200" height="12" fill="#dc2626"/>
  <text x="480" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">风控 Agent</text>
  <text x="394" y="318" font-size="10.5" fill="#0f172a">敞口 + 授信检查</text>
  <text x="394" y="338" font-size="10.5" fill="#0f172a">确定性计算为主</text>
  <text x="394" y="362" font-size="10" fill="#64748b">依据：库存表 + 制度库（04 MCP）</text>
  <text x="394" y="386" font-size="10" fill="#dc2626">超授信 → 一票 REJECT</text>

  <rect x="610" y="270" width="200" height="140" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="610" y="270" width="200" height="28" rx="10" fill="#ea580c"/><rect x="610" y="286" width="200" height="12" fill="#ea580c"/>
  <text x="710" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">物流 Agent</text>
  <text x="624" y="318" font-size="10.5" fill="#0f172a">港口产能 / 提货天数</text>
  <text x="624" y="338" font-size="10.5" fill="#0f172a">超 7 天标准周期 → WARN</text>
  <text x="624" y="362" font-size="10" fill="#64748b">依据：库存表</text>
  <text x="624" y="386" font-size="10" fill="#dc2626">窄职责：不评论行情</text>

  <line x1="390" y1="210" x2="270" y2="264" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowEV)"/>
  <line x1="450" y1="210" x2="480" y2="264" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowEV)"/>
  <line x1="510" y1="210" x2="690" y2="264" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowEV)"/>
  <text x="330" y="244" font-size="10.5" fill="#7c3aed">并行分发</text>

  <!-- 汇总裁决（代码规则） -->
  <rect x="290" y="450" width="320" height="120" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="290" y="450" width="320" height="28" rx="10" fill="#0f172a"/><rect x="290" y="466" width="320" height="12" fill="#0f172a"/>
  <text x="450" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">汇总裁决（代码规则，非 LLM）</text>
  <text x="304" y="498" font-size="10.5" fill="#0f172a">任一 REJECT → 驳回并说明</text>
  <text x="304" y="518" font-size="10.5" fill="#0f172a">有 WARN / 分歧 / HUMAN → 人工裁决</text>
  <text x="304" y="538" font-size="10.5" fill="#0f172a">全 PASS → 自动通过</text>
  <text x="304" y="560" font-size="10" fill="#dc2626">数据超 5 分钟新鲜度 → 强制 HUMAN</text>

  <line x1="250" y1="410" x2="380" y2="444" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowE)"/>
  <line x1="480" y1="410" x2="480" y2="444" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowE)"/>
  <line x1="710" y1="410" x2="580" y2="444" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowE)"/>

  <!-- 留痕 -->
  <rect x="700" y="450" width="200" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <rect x="700" y="450" width="200" height="28" rx="10" fill="#059669"/><rect x="700" y="466" width="200" height="12" fill="#059669"/>
  <text x="800" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">评审留痕 trace.db</text>
  <text x="714" y="498" font-size="10.5" fill="#0f172a">每个意见 + evidence JSON</text>
  <text x="714" y="518" font-size="10.5" fill="#0f172a">事后可追溯"为何批/驳"</text>
  <text x="714" y="542" font-size="10" fill="#64748b">推翻率 &gt;30% → 重训 Worker</text>

  <line x1="610" y1="510" x2="694" y2="510" stroke="#059669" stroke-width="2" marker-end="url(#arrowEG)"/>

  <!-- 兜底注 -->
  <rect x="40" y="450" width="200" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="54" y="476" font-size="11.5" font-weight="bold" fill="#ea580c">失败隔离（兜底线）</text>
  <text x="54" y="500" font-size="10.5" fill="#0f172a">任一 Worker 挂 → 该项标</text>
  <text x="54" y="520" font-size="10.5" fill="#0f172a">HUMAN"数据不可用"</text>
  <text x="54" y="544" font-size="10.5" fill="#0f172a">其余两方意见保留</text>
  <text x="54" y="564" font-size="10" fill="#64748b">不阻塞、不静默通过</text>

  <!-- 底注 -->
  <text x="480" y="606" text-anchor="middle" font-size="10.5" fill="#64748b">灰度：演练群并行两周 → RM 品种 ≤5000 吨试点 → 全量（REJECT/分歧永远人工终审）｜ 评估：意见一致率 ≥85%，P95 &lt; 60s</text>
</svg>
