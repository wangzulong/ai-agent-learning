<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowLoop" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#f8fafc"/>

  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Agent 项目交付七步框架（从需求到上线）</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#64748b">每步一个 commit ｜ 时间只够三件事：任务定义、评估集、灰度开关</text>

  <!-- 七步横向流程 -->
  <g>
    <rect x="40" y="100" width="118" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="40" y="100" width="118" height="30" rx="10" fill="#2563eb"/><rect x="40" y="118" width="118" height="12" fill="#2563eb"/>
    <text x="99" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">1 任务定义</text>
    <text x="52" y="150" font-size="10.5" fill="#0f172a">用户故事</text>
    <text x="52" y="168" font-size="10.5" fill="#0f172a">验收三线：质量</text>
    <text x="52" y="186" font-size="10.5" fill="#0f172a">性能 / 兜底</text>
    <text x="52" y="210" font-size="10" fill="#64748b">缺它→做了没人用</text>

    <line x1="158" y1="160" x2="184" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowG)"/>

    <rect x="186" y="100" width="118" height="120" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="186" y="100" width="118" height="30" rx="10" fill="#0891b2"/><rect x="186" y="118" width="118" height="12" fill="#0891b2"/>
    <text x="245" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">2 数据准备</text>
    <text x="198" y="150" font-size="10.5" fill="#0f172a">假数据脚本</text>
    <text x="198" y="168" font-size="10.5" fill="#0f172a">评估集隔离</text>
    <text x="198" y="186" font-size="10.5" fill="#0f172a">正常/边界/对抗</text>
    <text x="198" y="210" font-size="10" fill="#64748b">缺它→真实数据崩</text>

    <line x1="304" y1="160" x2="330" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowG)"/>

    <rect x="332" y="100" width="118" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="332" y="100" width="118" height="30" rx="10" fill="#7c3aed"/><rect x="332" y="118" width="118" height="12" fill="#7c3aed"/>
    <text x="391" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">3 工具设计</text>
    <text x="344" y="150" font-size="10.5" fill="#0f172a">粒度对齐业务</text>
    <text x="344" y="168" font-size="10.5" fill="#0f172a">入参用枚举</text>
    <text x="344" y="186" font-size="10.5" fill="#0f172a">读写分离</text>
    <text x="344" y="210" font-size="10" fill="#64748b">缺它→模型乱调</text>

    <line x1="450" y1="160" x2="476" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowG)"/>

    <rect x="478" y="100" width="118" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <rect x="478" y="100" width="118" height="30" rx="10" fill="#059669"/><rect x="478" y="118" width="118" height="12" fill="#059669"/>
    <text x="537" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">4 实现</text>
    <text x="490" y="150" font-size="10.5" fill="#0f172a">分4~5阶段</text>
    <text x="490" y="168" font-size="10.5" fill="#0f172a">每阶段=1 commit</text>
    <text x="490" y="186" font-size="10.5" fill="#0f172a">代码全部可跑</text>
    <text x="490" y="210" font-size="10" fill="#64748b">缺它→无法回滚</text>

    <line x1="596" y1="160" x2="622" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowG)"/>

    <rect x="624" y="100" width="118" height="120" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="624" y="100" width="118" height="30" rx="10" fill="#ea580c"/><rect x="624" y="118" width="118" height="12" fill="#ea580c"/>
    <text x="683" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">5 评估</text>
    <text x="636" y="150" font-size="10.5" fill="#0f172a">字段级 P/R/F1</text>
    <text x="636" y="168" font-size="10.5" fill="#0f172a">回退>2% 禁合并</text>
    <text x="636" y="186" font-size="10.5" fill="#0f172a">成本与延迟同测</text>
    <text x="636" y="210" font-size="10" fill="#64748b">缺它→无法比版本</text>

    <line x1="742" y1="160" x2="768" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowG)"/>

    <rect x="770" y="100" width="150" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="770" y="100" width="150" height="30" rx="10" fill="#dc2626"/><rect x="770" y="118" width="150" height="12" fill="#dc2626"/>
    <text x="845" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">6 灰度</text>
    <text x="782" y="150" font-size="10.5" fill="#0f172a">影子模式→白名单</text>
    <text x="782" y="168" font-size="10.5" fill="#0f172a">→半量/全量</text>
    <text x="782" y="186" font-size="10.5" fill="#0f172a">降级开关常备</text>
    <text x="782" y="210" font-size="10" fill="#64748b">缺它→全量翻车</text>
  </g>

  <!-- 第7步 运营 -->
  <rect x="240" y="266" width="480" height="110" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="240" y="266" width="480" height="30" rx="10" fill="#0f172a"/><rect x="240" y="284" width="480" height="12" fill="#0f172a"/>
  <text x="480" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">7 运营（上线不是终点）</text>
  <text x="260" y="318" font-size="11" fill="#0f172a">每天看监控（调用量/延迟/置信度）　每天抽 20 条人审</text>
  <text x="260" y="340" font-size="11" fill="#0f172a">坏例实时入库 → 补评估集 → 月度迭代回归</text>
  <text x="260" y="362" font-size="10.5" fill="#dc2626">坏例不进评估集的收集是白收集 —— 每个抱怨都该变成回归用例</text>
  <path d="M 845 220 Q 845 320 726 320" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- 运营反哺闭环 -->
  <path d="M 240 321 Q 130 321 130 226" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowLoop)"/>
  <text x="112" y="280" font-size="11" font-weight="bold" fill="#ea580c">坏例反哺</text>
  <text x="86" y="298" font-size="10.5" fill="#ea580c">闭环迭代</text>

  <!-- 灰度三档示意 -->
  <rect x="40" y="404" width="880" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="432" font-size="13" font-weight="bold" fill="#0f172a">灰度三档（步骤 6 展开）</text>
  <rect x="60" y="448" width="260" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="76" y="470" font-size="11.5" font-weight="bold" fill="#dc2626">影子模式（1 周）</text>
  <text x="76" y="492" font-size="10.5" fill="#0f172a">AI 结果只写日志不进业务表</text>
  <line x1="320" y1="477" x2="352" y2="477" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="356" y="448" width="260" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="372" y="470" font-size="11.5" font-weight="bold" fill="#ea580c">白名单（1~2 周）</text>
  <text x="372" y="492" font-size="10.5" fill="#0f172a">3~5 个内部用户，反馈进 issue</text>
  <line x1="616" y1="477" x2="648" y2="477" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="652" y="448" width="250" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="668" y="470" font-size="11.5" font-weight="bold" fill="#059669">全量</text>
  <text x="668" y="492" font-size="10.5" fill="#0f172a">达标放量，降级开关常备</text>
</svg>
