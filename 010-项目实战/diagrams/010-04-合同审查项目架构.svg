<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowB2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowO2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#f8fafc"/>

  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">项目 02 架构：贸易合同审查助手（001 Prompt + 005 RAG + 结构化输出）</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#64748b">两条腿审查：向量检索找"同类标准条款"（初筛），LLM 逐条推理判风险（判定）</text>

  <!-- 输入 -->
  <rect x="40" y="100" width="160" height="90" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="40" y="100" width="160" height="28" rx="10" fill="#0891b2"/><rect x="40" y="116" width="160" height="12" fill="#0891b2"/>
  <text x="120" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">合同 PDF 上传</text>
  <text x="54" y="150" font-size="10.5" fill="#0f172a">40+ 页贸易合同</text>
  <text x="54" y="170" font-size="10.5" fill="#64748b">PyMuPDF 解析</text>

  <!-- 切分 -->
  <rect x="250" y="100" width="170" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="250" y="100" width="170" height="28" rx="10" fill="#2563eb"/><rect x="250" y="116" width="170" height="12" fill="#2563eb"/>
  <text x="335" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">条款级切分</text>
  <text x="264" y="150" font-size="10.5" fill="#0f172a">正则定位"第X条"</text>
  <text x="264" y="170" font-size="10.5" fill="#64748b">条款号+标题+正文入元数据</text>

  <line x1="200" y1="145" x2="244" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowB2)"/>

  <!-- 向量库 -->
  <rect x="470" y="86" width="180" height="118" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <rect x="470" y="86" width="180" height="28" rx="10" fill="#059669"/><rect x="470" y="102" width="180" height="12" fill="#059669"/>
  <text x="560" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">条款向量库</text>
  <text x="484" y="134" font-size="10.5" fill="#0f172a">embedding-3-small</text>
  <text x="484" y="154" font-size="10.5" fill="#0f172a">条款 chunk + 元数据</text>
  <text x="484" y="180" font-size="10" fill="#64748b">双库：合同条款 / 公司标准条款</text>

  <!-- 标准库 -->
  <rect x="470" y="240" width="180" height="90" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <rect x="470" y="240" width="180" height="28" rx="10" fill="#059669"/><rect x="470" y="256" width="180" height="12" fill="#059669"/>
  <text x="560" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">公司风险条款清单库</text>
  <text x="484" y="288" font-size="10.5" fill="#0f172a">付款 ≤30% ｜ 违约金 ≥8%</text>
  <text x="484" y="308" font-size="10.5" fill="#0f172a">法务维护，季度更新版本化</text>

  <line x1="420" y1="145" x2="464" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowB2)"/>
  <line x1="420" y1="165" x2="464" y2="270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowB2)"/>

  <!-- 相似度比对 -->
  <rect x="700" y="240" width="210" height="90" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="700" y="240" width="210" height="28" rx="10" fill="#ea580c"/><rect x="700" y="256" width="210" height="12" fill="#ea580c"/>
  <text x="805" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">余弦相似度比对（初筛）</text>
  <text x="714" y="288" font-size="10.5" fill="#0f172a">找最相似公司标准 → 附给 LLM</text>
  <text x="714" y="308" font-size="10.5" fill="#64748b">检索只初筛，风险判定靠 LLM</text>

  <line x1="650" y1="285" x2="694" y2="285" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowO2)"/>

  <!-- LLM 逐条审查 -->
  <rect x="700" y="86" width="210" height="118" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="700" y="86" width="210" height="28" rx="10" fill="#7c3aed"/><rect x="700" y="102" width="210" height="12" fill="#7c3aed"/>
  <text x="805" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">LLM 逐条条款审查</text>
  <text x="714" y="134" font-size="10.5" fill="#0f172a">输出 JSON：has_risk / level</text>
  <text x="714" y="154" font-size="10.5" fill="#0f172a">risk / quote / suggestion</text>
  <text x="714" y="174" font-size="10.5" fill="#0f172a">temperature=0，不编造</text>
  <text x="714" y="196" font-size="10" fill="#64748b">避长文注意力稀释 → 逐条审</text>

  <path d="M 805 330 L 805 358" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowO2)"/>

  <!-- 引用核验 -->
  <rect x="600" y="362" width="310" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="600" y="362" width="310" height="28" rx="10" fill="#dc2626"/><rect x="600" y="378" width="310" height="12" fill="#dc2626"/>
  <text x="755" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">引用核验 verified（防幻觉红线）</text>
  <text x="614" y="410" font-size="10.5" fill="#0f172a">quote 前 12 字必须命中条款原文</text>
  <text x="614" y="430" font-size="10.5" fill="#0f172a">未命中 → 标 needs_human，不采信</text>

  <!-- 报告 -->
  <rect x="250" y="362" width="290" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="250" y="362" width="290" height="28" rx="10" fill="#2563eb"/><rect x="250" y="378" width="290" height="12" fill="#2563eb"/>
  <text x="395" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">审查报告（按风险等级排序）</text>
  <text x="264" y="410" font-size="10.5" fill="#0f172a">高→中→低 ｜ 条款号 + 原文引用 + 修改建议</text>
  <text x="264" y="430" font-size="10.5" fill="#64748b">Vue 报告页 → 法务只复核高风险条目</text>

  <line x1="594" y1="408" x2="546" y2="408" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowB2)"/>

  <!-- 评估注 -->
  <rect x="40" y="362" width="170" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="54" y="388" font-size="11" font-weight="bold" fill="#0f172a">评估方案</text>
  <text x="54" y="410" font-size="10.5" fill="#0f172a">5 份合同 10 个埋点风险</text>
  <text x="54" y="430" font-size="10.5" fill="#0f172a">召回 ≥0.9 ｜ 引用核验 100%</text>

  <path d="M 250 470 Q 120 470 100 458" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowO2)"/>

  <!-- 底注 -->
  <text x="480" y="500" text-anchor="middle" font-size="10.5" fill="#64748b">性能：50 页 &lt; 90s（逐条并发调 LLM + 批量 embedding）｜ 降级：PDF 加密/解析失败 → 转法务人工流程</text>
  <text x="480" y="522" text-anchor="middle" font-size="10.5" fill="#64748b">灰度：AI 报告与法务并行一周 → 3 人试用作初审参考 → 全量前置复核</text>
</svg>
