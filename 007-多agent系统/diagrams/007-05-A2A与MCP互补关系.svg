<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="600" fill="#f8fafc"/>
  <defs>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">A2A 与 MCP：同一套 Agent 栈的互补两层（2026-09）</text>
  <text x="480" y="59" text-anchor="middle" font-size="11" fill="#64748b">MCP 管纵向「Agent 连工具」，A2A 管横向「Agent 连 Agent」——不是二选一，是一起用</text>

  <line x1="480" y1="76" x2="480" y2="360" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 左：A2A -->
  <rect x="40" y="80" width="410" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="80" width="410" height="8" rx="4" fill="#7c3aed"/>
  <text x="245" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">A2A：Agent ↔ Agent（横向跨组织）</text>
  <rect x="70" y="140" width="140" height="56" rx="10" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="140" y="163" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b21b6">我方 Agent</text>
  <text x="140" y="182" text-anchor="middle" font-size="10" fill="#7c3aed">LangGraph 编排</text>
  <rect x="280" y="140" width="140" height="56" rx="10" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="350" y="163" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b21b6">对方 Agent</text>
  <text x="350" y="182" text-anchor="middle" font-size="10" fill="#7c3aed">CrewAI / 别家系统</text>
  <line x1="214" y1="160" x2="276" y2="160" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)" marker-start="url(#aP)"/>
  <text x="245" y="150" text-anchor="middle" font-size="9.5" fill="#7c3aed">互操作</text>
  <text x="245" y="216" text-anchor="middle" font-size="10" fill="#64748b">发现：/.well-known/agent-card.json</text>
  <text x="245" y="234" text-anchor="middle" font-size="10" fill="#64748b">工作单元：Task 状态机</text>
  <text x="245" y="252" text-anchor="middle" font-size="10" fill="#64748b">submitted → working → completed / failed</text>
  <text x="245" y="270" text-anchor="middle" font-size="10" fill="#64748b">流式：SSE 逐步回报进度；产物：Artifact</text>
  <text x="245" y="296" text-anchor="middle" font-size="10.5" fill="#7c3aed">关键：只暴露 Task 与消息，不暴露内部推理</text>
  <text x="245" y="316" text-anchor="middle" font-size="10.5" fill="#7c3aed">v1.0（2026-04）支持签名 Agent Card（JWS）</text>
  <text x="245" y="340" text-anchor="middle" font-size="10" fill="#94a3b8">适合：长任务、需多轮澄清、跨厂商委托</text>

  <!-- 右：MCP -->
  <rect x="510" y="80" width="410" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="510" y="80" width="410" height="8" rx="4" fill="#ea580c"/>
  <text x="715" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">MCP：Agent → 工具 / 数据（纵向）</text>
  <rect x="640" y="136" width="150" height="44" rx="10" fill="#ffedd5" stroke="#fdba74"/>
  <text x="715" y="163" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a3412">我的 Agent</text>
  <line x1="715" y1="180" x2="715" y2="204" stroke="#ea580c" stroke-width="2" marker-end="url(#aO)"/>
  <rect x="600" y="206" width="230" height="34" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="715" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">MCP Server（能力中介）</text>
  <line x1="640" y1="240" x2="580" y2="270" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aO)"/>
  <line x1="715" y1="240" x2="715" y2="270" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aO)"/>
  <line x1="790" y1="240" x2="850" y2="270" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aO)"/>
  <rect x="530" y="272" width="100" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="580" y="296" text-anchor="middle" font-size="10.5" fill="#334155">数据库 / CTRM</text>
  <rect x="665" y="272" width="100" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="715" y="296" text-anchor="middle" font-size="10.5" fill="#334155">行情 API</text>
  <rect x="800" y="272" width="100" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="850" y="296" text-anchor="middle" font-size="10.5" fill="#334155">文件 / 检索</text>
  <text x="715" y="332" text-anchor="middle" font-size="10.5" fill="#ea580c">工具 schema 显式暴露；initialize 时能力协商</text>
  <text x="715" y="350" text-anchor="middle" font-size="10" fill="#94a3b8">适合：同进程/同组织的确定性能力调用</text>

  <!-- 底部对比表 -->
  <rect x="40" y="380" width="880" height="158" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="40" y1="412" x2="920" y2="412" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="401" font-size="12" font-weight="bold" fill="#0f172a">维度</text>
  <text x="400" y="401" font-size="12" font-weight="bold" fill="#7c3aed">A2A</text>
  <text x="700" y="401" font-size="12" font-weight="bold" fill="#ea580c">MCP</text>
  <line x1="40" y1="451" x2="920" y2="451" stroke="#f1f5f9" stroke-width="1"/>
  <text x="120" y="438" font-size="11" fill="#334155">连接对象</text>
  <text x="400" y="438" font-size="11" fill="#475569">Agent ↔ Agent（对等协作）</text>
  <text x="700" y="438" font-size="11" fill="#475569">Agent → 工具 / 数据源</text>
  <line x1="40" y1="490" x2="920" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <text x="120" y="477" font-size="11" fill="#334155">工作单元</text>
  <text x="400" y="477" font-size="11" fill="#475569">Task（状态机 + 多轮消息 + Artifact）</text>
  <text x="700" y="477" font-size="11" fill="#475569">一次工具调用 / 资源读取</text>
  <text x="120" y="516" font-size="11" fill="#334155">治理现状</text>
  <text x="400" y="516" font-size="11" fill="#475569">AAIF Growth Stage（2026-08 接纳）</text>
  <text x="700" y="516" font-size="11" fill="#475569">AAIF 创始项目（2025-12 起托管）</text>

  <!-- 底部结论 -->
  <rect x="120" y="552" width="720" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="480" y="574" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">生产栈通行做法：MCP 给每个 Agent 发工具，A2A 让 Agent 跨界协作；同进程内的 Agent 别走 HTTP</text>
</svg>
