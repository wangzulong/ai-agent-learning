<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="620" fill="#f8fafc"/>
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">多 Agent 四大失败模式与对应防御</text>
  <text x="480" y="59" text-anchor="middle" font-size="11" fill="#64748b">失败模式可预测、可防御——把防御写进派活逻辑，而不是指望模型自觉</text>

  <!-- 表头 -->
  <text x="230" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">失败模式（症状与根因）</text>
  <text x="730" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">防御手段（写进代码）</text>

  <!-- 行1 -->
  <rect x="40" y="104" width="380" height="96" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="58" y="130" font-size="12.5" font-weight="bold" fill="#dc2626">① 谁也不认账（交付物对不上）</text>
  <text x="58" y="152" font-size="10.5" fill="#7f1d1d">三个 Worker 各说各话：字段名随意、</text>
  <text x="58" y="170" font-size="10.5" fill="#7f1d1d">单位不统一、缺关键字段，主管没法汇总</text>
  <text x="58" y="190" font-size="9.5" fill="#b91c1c">CTRM 印证：抽取员给「数量」，风控员要「手数」</text>
  <line x1="424" y1="152" x2="536" y2="152" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/>
  <rect x="540" y="104" width="380" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="558" y="130" font-size="12.5" font-weight="bold" fill="#059669">交付物 Schema 前置 + 自动校验</text>
  <text x="558" y="152" font-size="10.5" fill="#065f46">派活时就把验收标准（JSON Schema）</text>
  <text x="558" y="170" font-size="10.5" fill="#065f46">写进任务；产出先过校验再进汇总</text>
  <text x="558" y="190" font-size="9.5" fill="#047857">不合规则定向打回，附错误原因，最多 1 轮</text>

  <!-- 行2 -->
  <rect x="40" y="216" width="380" height="96" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="58" y="242" font-size="12.5" font-weight="bold" fill="#dc2626">② 信息丢失（handoff 变甩锅）</text>
  <text x="58" y="264" font-size="10.5" fill="#7f1d1d">交接只说「你去处理下」：不带数据、</text>
  <text x="58" y="282" font-size="10.5" fill="#7f1d1d">不带口径，接手的 Agent 只能瞎猜瞎查</text>
  <text x="58" y="302" font-size="9.5" fill="#b91c1c">后果：同一事实两次查询结果不一致，结论打架</text>
  <line x1="424" y1="264" x2="536" y2="264" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/>
  <rect x="540" y="216" width="380" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="558" y="242" font-size="12.5" font-weight="bold" fill="#059669">结构化 handoff 四件套必填</text>
  <text x="558" y="264" font-size="10.5" fill="#065f46">任务目标 + 输入数据 + 输出 Schema</text>
  <text x="558" y="282" font-size="10.5" fill="#065f46">+ 边界（别做什么）</text>
  <text x="558" y="302" font-size="9.5" fill="#047857">缺一项直接抛异常，不让 Agent 靠猜接活</text>

  <!-- 行3 -->
  <rect x="40" y="328" width="380" height="96" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="58" y="354" font-size="12.5" font-weight="bold" fill="#dc2626">③ 循环踢皮球（无限交接）</text>
  <text x="58" y="376" font-size="10.5" fill="#7f1d1d">A 说「这该 B 管」，B 说「A 更清楚」，</text>
  <text x="58" y="394" font-size="10.5" fill="#7f1d1d">handoff 来回打乒乓，Token 白白烧掉</text>
  <text x="58" y="414" font-size="9.5" fill="#b91c1c">网状拓扑尤其高发：没人拍板，人人推责</text>
  <line x1="424" y1="376" x2="536" y2="376" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/>
  <rect x="540" y="328" width="380" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="558" y="354" font-size="12.5" font-weight="bold" fill="#059669">轮次上限 + 超时熔断 + 升级人工</text>
  <text x="558" y="376" font-size="10.5" fill="#065f46">全局 handoff 计数：超过上限立即停</text>
  <text x="558" y="394" font-size="10.5" fill="#065f46">止，升级人工或带着已得结论失败退出</text>
  <text x="558" y="414" font-size="9.5" fill="#047857">星型拓扑天然少发：拍板权始终在主管</text>

  <!-- 行4 -->
  <rect x="40" y="440" width="380" height="96" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="58" y="466" font-size="12.5" font-weight="bold" fill="#dc2626">④ 成本失控（Token 放大约 15 倍）</text>
  <text x="58" y="488" font-size="10.5" fill="#7f1d1d">并行多路 + 各自工具调用，消耗约为</text>
  <text x="58" y="506" font-size="10.5" fill="#7f1d1d">单 Agent 聊天的 15 倍（Anthropic 实测）</text>
  <text x="58" y="526" font-size="9.5" fill="#b91c1c">一次全量回溯跑批，月账单直接爆表</text>
  <line x1="424" y1="488" x2="536" y2="488" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/>
  <rect x="540" y="440" width="380" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="558" y="466" font-size="12.5" font-weight="bold" fill="#059669">预算护栏 + 模型分级路由</text>
  <text x="558" y="488" font-size="10.5" fill="#065f46">单任务/单日 Token 硬上限；Worker 用</text>
  <text x="558" y="506" font-size="10.5" fill="#065f46">小杯模型，主管才用大杯</text>
  <text x="558" y="526" font-size="9.5" fill="#047857">上线先抽样试跑估成本，再放开全量</text>

  <!-- 底部可观测横幅 -->
  <rect x="40" y="552" width="880" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="480" y="574" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">生命线：可观测——每条 Agent 间消息带 trace_id / 角色 / 耗时 / Token 数，出问题按 trace 回放定位</text>
  <text x="480" y="594" text-anchor="middle" font-size="10.5" fill="#64748b">LangSmith、Langfuse 等平台可直接接入；自己打日志也行，但不能没有</text>
</svg>
