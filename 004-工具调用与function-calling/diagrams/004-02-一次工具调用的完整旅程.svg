<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="680" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">一次工具调用的完整旅程（004 原理篇 / 实战篇）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">模型不执行工具，只生成"调用意图" —— 校验、执行、回填全是客户端代码的活，循环到没有调用为止</text>

  <defs>
    <marker id="j1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="j2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 四泳道表头 -->
  <rect x="40" y="80" width="170" height="40" rx="8" fill="#f1f5f9"/><text x="125" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">用户 / 业务</text>
  <rect x="230" y="80" width="230" height="40" rx="8" fill="#dbeafe"/><text x="345" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">模型（LLM）</text>
  <rect x="480" y="80" width="230" height="40" rx="8" fill="#d1fae5"/><text x="595" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065f46">客户端代码（你的地盘）</text>
  <rect x="730" y="80" width="190" height="40" rx="8" fill="#cffafe"/><text x="825" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#155e75">外部系统</text>

  <line x1="345" y1="120" x2="345" y2="640" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="595" y1="120" x2="595" y2="640" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="825" y1="120" x2="825" y2="640" stroke="#a5f3fc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ① -->
  <text x="125" y="155" font-size="11" fill="#334155">客户邮件进来</text>
  <line x1="200" y1="162" x2="336" y2="162" stroke="#2563eb" stroke-width="2.5" marker-end="url(#j1)"/>
  <text x="268" y="152" text-anchor="middle" font-size="10.5" fill="#1e40af">① 请求：messages + tools 定义</text>
  <circle cx="60" cy="162" r="13" fill="#2563eb"/><text x="60" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">1</text>

  <!-- ② -->
  <line x1="356" y1="232" x2="584" y2="232" stroke="#2563eb" stroke-width="2.5" marker-end="url(#j1)"/>
  <text x="470" y="222" text-anchor="middle" font-size="10.5" fill="#1e40af">② tool_calls：工具名 + JSON 参数（意图）</text>
  <circle cx="60" cy="232" r="13" fill="#2563eb"/><text x="60" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">2</text>
  <text x="352" y="256" font-size="9.5" fill="#64748b">stop_reason = tool_use</text>

  <!-- ③ -->
  <rect x="610" y="292" width="170" height="50" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="695" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">③ 校验：schema/enum/业务规则</text>
  <text x="695" y="332" text-anchor="middle" font-size="9.5" fill="#166534">非法参数 → 回填错误让其自纠</text>
  <circle cx="60" cy="317" r="13" fill="#059669"/><text x="60" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">3</text>
  <line x1="595" y1="317" x2="608" y2="317" stroke="#94a3b8" stroke-width="2" marker-end="url(#j2)"/>

  <!-- ④ -->
  <line x1="782" y1="387" x2="818" y2="387" stroke="#2563eb" stroke-width="2.5" marker-end="url(#j1)"/>
  <text x="800" y="377" text-anchor="middle" font-size="10.5" fill="#1e40af">④ 真实执行</text>
  <circle cx="60" cy="387" r="13" fill="#2563eb"/><text x="60" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">4</text>
  <rect x="738" y="404" width="176" height="56" rx="8" fill="#f1f5f9"/>
  <text x="826" y="424" text-anchor="middle" font-size="10" fill="#334155">CTRM MySQL（只读账号）</text>
  <text x="826" y="440" text-anchor="middle" font-size="10" fill="#334155">期货行情 API（缓存 60s）</text>
  <text x="826" y="456" text-anchor="middle" font-size="9.5" fill="#dc2626">写操作 → 挂起人工确认</text>

  <!-- ⑤ -->
  <rect x="610" y="480" width="170" height="50" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="695" y="502" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">⑤ 组装 tool_result 回填</text>
  <text x="695" y="520" text-anchor="middle" font-size="9.5" fill="#166534">过长先截取 / 摘要（token 预算）</text>
  <circle cx="60" cy="505" r="13" fill="#059669"/><text x="60" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">5</text>
  <line x1="818" y1="462" x2="784" y2="492" stroke="#94a3b8" stroke-width="2" marker-end="url(#j2)"/>

  <!-- ⑥ -->
  <line x1="584" y1="570" x2="356" y2="570" stroke="#2563eb" stroke-width="2.5" marker-end="url(#j1)"/>
  <text x="470" y="560" text-anchor="middle" font-size="10.5" fill="#1e40af">⑥ 结果进入上下文 → 模型续答或再次调用</text>
  <circle cx="60" cy="570" r="13" fill="#2563eb"/><text x="60" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">6</text>

  <!-- 终止 -->
  <rect x="230" y="612" width="230" height="44" rx="8" fill="#dbeafe"/>
  <text x="345" y="630" text-anchor="middle" font-size="10.5" fill="#1e40af">某轮没有 tool_calls</text>
  <text x="345" y="647" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">→ 输出最终回答，循环结束</text>
  <line x1="345" y1="592" x2="345" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#j2)"/>

  <!-- 循环提示 -->
  <path d="M 620 596 Q 595 620 620 640" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="640" y="624" font-size="10.5" fill="#ea580c">② ~ ⑥ 循环往复（= 003 篇 Agent 循环的单圈）</text>

  <text x="480" y="668" text-anchor="middle" font-size="11" fill="#64748b">三家 SDK 的差别只在②⑥的包装（function_call / tool_use / functionCall），①③④⑤ 完全同构 → 07 篇对照表</text>
</svg>
