<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">错误处理与重试决策树（004 生产篇）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">分界线一句话：换个时间重试会不会好 —— 会 → 代码层吞掉；不会 → 回填让模型自纠；自纠三次 → 转人工</text>

  <defs>
    <marker id="e1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 起点 -->
  <rect x="380" y="90" width="200" height="50" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">工具调用失败</text>
  <text x="480" y="130" text-anchor="middle" font-size="10.5" fill="#1d4ed8">返回异常 / 超时 / 业务拒绝</text>

  <line x1="480" y1="140" x2="480" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>

  <!-- 判断1 -->
  <polygon points="480,170 620,215 480,260 340,215" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">传输类错误？</text>
  <text x="480" y="230" text-anchor="middle" font-size="10" fill="#b45309">超时 / 网络 / 5xx / 限流</text>

  <!-- 是：代码层 -->
  <line x1="340" y1="215" x2="200" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <text x="270" y="203" text-anchor="middle" font-size="10.5" fill="#64748b">是</text>
  <rect x="40" y="180" width="300" height="110" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="56" y="206" font-size="12.5" font-weight="bold" fill="#065f46">代码层吞掉：指数退避重试 ×3</text>
  <text x="56" y="228" font-size="10.5" fill="#047857">1s → 2s → 4s；加抖动防惊群</text>
  <text x="56" y="248" font-size="10.5" fill="#047857">前提：工具幂等（request_id 去重）</text>
  <text x="56" y="272" font-size="10.5" fill="#dc2626">模型全程无感 —— 它不该知道 HTTP 抖动</text>

  <!-- 否：语义类 -->
  <line x1="480" y1="260" x2="480" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <text x="496" y="280" font-size="10.5" fill="#64748b">否（语义类）</text>

  <!-- 判断2 -->
  <polygon points="480,292 640,337 480,382 320,337" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">错误信息可自纠吗？</text>
  <text x="480" y="352" text-anchor="middle" font-size="10" fill="#b45309">说了错在哪 + 给出出路</text>

  <!-- 是：回填 -->
  <line x1="320" y1="337" x2="200" y2="337" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <text x="262" y="325" text-anchor="middle" font-size="10.5" fill="#64748b">是</text>
  <rect x="40" y="300" width="280" height="120" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="56" y="326" font-size="12.5" font-weight="bold" fill="#155e75">回填错误文本 → 模型自纠</text>
  <text x="56" y="348" font-size="10.5" fill="#0e7490">"品种 M9 不存在，可用：M/RM/Y"</text>
  <text x="56" y="368" font-size="10.5" fill="#0e7490">四要素：错在哪/给出路/可判定/止损</text>
  <text x="56" y="392" font-size="10.5" fill="#dc2626">禁止抛异常 —— 模型读不到就纠不了</text>

  <!-- 自纠循环计数 -->
  <rect x="40" y="440" width="280" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="56" y="464" font-size="12" font-weight="bold" fill="#9a3412">自纠计数 &gt; 3 次？</text>
  <text x="56" y="486" font-size="10.5" fill="#c2410c">是 → 判定"模型层修不好"，终止循环</text>
  <text x="56" y="502" font-size="10.5" fill="#c2410c">防无限纠错烧钱（早停联动 003）</text>
  <line x1="180" y1="420" x2="180" y2="438" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>

  <!-- 否：致命 -->
  <line x1="640" y1="337" x2="750" y2="337" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <text x="696" y="325" text-anchor="middle" font-size="10.5" fill="#64748b">否</text>
  <rect x="752" y="300" width="168" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="768" y="326" font-size="12" font-weight="bold" fill="#b91c1c">致命类：直接降级</text>
  <text x="768" y="348" font-size="10.5" fill="#991b1b">权限拒绝 / 数据异常</text>
  <text x="768" y="368" font-size="10.5" fill="#991b1b">→ 出口C：草稿转人工</text>
  <text x="768" y="388" font-size="10.5" fill="#991b1b">（003 篇预算刹车）</text>

  <!-- 底部：反模式 -->
  <rect x="40" y="530" width="880" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="480" y="554" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">三个反模式：① 工具里抛异常（模型失明）② 代码层替模型猜参数（越俎代庖）③ 无限自纠不设上限（烧钱跑步机）</text>
  <text x="480" y="580" text-anchor="middle" font-size="11" fill="#991b1b">配套：每步失败进 trace（模型/工具/入参/错误/耗时），badcase 回流评估集</text>
</svg>
