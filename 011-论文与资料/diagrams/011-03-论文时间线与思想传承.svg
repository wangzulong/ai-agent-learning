  <line x1="245" y1="340" x2="245" y2="406" stroke="#0891b2" stroke-width="2"/>
  <circle cx="245" cy="340" r="6" fill="#0891b2"/>
  <text x="245" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">RAG 原论文</text>
  <text x="245" y="450" text-anchor="middle" font-size="10.5" fill="#64748b">2020 · 开卷考试</text>

  <line x1="470" y1="340" x2="470" y2="406" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="470" cy="340" r="6" fill="#7c3aed"/>
  <text x="470" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Self-Consistency</text>
