  <line x1="625" y1="340" x2="625" y2="406" stroke="#ea580c" stroke-width="2"/>
  <circle cx="625" cy="340" r="6" fill="#ea580c"/>
  <text x="625" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Toolformer</text>
  <text x="625" y="450" text-anchor="middle" font-size="10.5" fill="#64748b">2023 · 自学调 API</text>

  <line x1="730" y1="340" x2="730" y2="406" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="730" cy="340" r="6" fill="#7c3aed"/>
  <text x="730" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Tree of Thoughts</text>
  <text x="730" y="450" text-anchor="middle" font-size="10.5" fill="#64748b">2023 · 思维树</text>

  <line x1="845" y1="340" x2="845" y2="406" stroke="#0891b2" stroke-width="2"/>
  <circle cx="845" cy="340" r="6" fill="#0891b2"/>
  <text x="845" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">MemGPT</text>
  <text x="845" y="450" text-anchor="middle" font-size="10.5" fill="#64748b">2023 · 分层记忆</text>

  <!-- 传承箭头：上走廊 -->
  <path d="M 170 230 V 205 H 390 V 230" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar3p)"/>
  <path d="M 390 230 V 178 H 540 V 230" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar3p)"/>
  <path d="M 540 230 V 205 H 680 V 230" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ar3p)"/>
  <!-- 传承箭头：下走廊 -->
  <path d="M 470 456 V 482 H 730 V 456" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar3p)"/>
  <path d="M 245 456 V 505 H 845 V 456" fill="none" stroke="#0891b2" stroke-width="1.8" marker-end="url(#ar3c)"/>

  <!-- 图例行 -->
  <g font-size="11" fill="#334155">
    <text x="70" y="530" font-weight="bold" fill="#0f172a">色区：</text>
    <circle cx="128" cy="526" r="5" fill="#2563eb"/><text x="138" y="530">基础/提示</text>
    <circle cx="216" cy="526" r="5" fill="#7c3aed"/><text x="226" y="530">推理增强</text>
    <circle cx="304" cy="526" r="5" fill="#ea580c"/><text x="314" y="530">Agent 行为</text>
    <circle cx="392" cy="526" r="5" fill="#0891b2"/><text x="402" y="530">知识与记忆</text>
    <text x="480" y="530" fill="#64748b">CoT→SC/ToT：推理主干 · ReAct→Reflexion：行为主干 · RAG→MemGPT：记忆主干</text>
  </g>

  <!-- 演进条 -->
  <rect x="60" y="548" width="840" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="480" y="574" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">2025 → 2026：主干仍在延伸</text>
  <text x="480" y="596" text-anchor="middle" font-size="10.5" fill="#64748b">推理模型（test-time compute）· MCP 工具生态 · 上下文工程 · 多 Agent 与评估生产化 —— 以 02-扩展论文索引 / 03-博客清单 跟进</text>
</svg>
