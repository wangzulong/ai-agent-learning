  <line x1="170" y1="340" x2="170" y2="274" stroke="#2563eb" stroke-width="2"/>
  <circle cx="170" cy="340" r="6" fill="#2563eb"/>
  <text x="170" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">GPT-3 few-shot</text>
  <text x="170" y="264" text-anchor="middle" font-size="10.5" fill="#64748b">2020 · in-context</text>

  <line x1="390" y1="340" x2="390" y2="274" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="390" cy="340" r="6" fill="#7c3aed"/>
