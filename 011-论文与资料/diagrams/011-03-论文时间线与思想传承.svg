  <line x1="890" y1="340" x2="890" y2="274" stroke="#2563eb" stroke-width="2"/>
  <circle cx="890" cy="340" r="6" fill="#2563eb"/>
  <text x="890" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Prompt Report</text>
  <text x="890" y="264" text-anchor="middle" font-size="10.5" fill="#64748b">2024 · 58 技术字典</text>

