    <line x1="70" y1="334" x2="70" y2="346" stroke="#94a3b8" stroke-width="2"/><text x="70" y="362" text-anchor="middle">2019</text>
    <line x1="220" y1="334" x2="220" y2="346" stroke="#94a3b8" stroke-width="2"/><text x="220" y="362" text-anchor="middle">2020</text>
    <line x1="330" y1="334" x2="330" y2="346" stroke="#94a3b8" stroke-width="2"/><text x="330" y="362" text-anchor="middle">2021</text>
    <line x1="460" y1="334" x2="460" y2="346" stroke="#94a3b8" stroke-width="2"/><text x="460" y="362" text-anchor="middle">2022</text>
    <line x1="620" y1="334" x2="620" y2="346" stroke="#94a3b8" stroke-width="2"/><text x="620" y="362" text-anchor="middle">2023</text>
    <line x1="740" y1="334" x2="740" y2="346" stroke="#94a3b8" stroke-width="2"/><text x="740" y="362" text-anchor="middle">2024</text>
    <line x1="820" y1="334" x2="820" y2="346" stroke="#94a3b8" stroke-width="2"/><text x="820" y="362" text-anchor="middle">2025</text>
