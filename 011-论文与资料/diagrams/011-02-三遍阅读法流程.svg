<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">三遍阅读法流程</text>
  <text x="480" y="64" text-anchor="middle" font-size="12" fill="#64748b">每一遍目标不同：先判断值不值，再精读做卡，最后带着实现问题复读</text>

  <!-- 第一遍 -->
  <rect x="40" y="96" width="250" height="280" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="96" width="250" height="38" rx="10" fill="#2563eb"/>
  <rect x="40" y="120" width="250" height="14" fill="#2563eb"/>
  <text x="165" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">第一遍 · 判断值不值读</text>
  <text x="56" y="164" font-size="11.5" fill="#334155">只读四样：</text>
  <text x="56" y="186" font-size="11.5" fill="#334155">标题 / 摘要 / 图 1 / 结论</text>
  <text x="56" y="210" font-size="11.5" fill="#334155">回答一个问题：</text>
  <text x="56" y="244" font-size="12.5" font-weight="bold" fill="#2563eb">"这篇论文解决什么痛？"</text>
  <text x="56" y="276" font-size="10.5" fill="#64748b">看不懂的词跳过，不硬啃</text>
  <text x="56" y="356" font-size="10.5" fill="#64748b">用时：约 10 分钟 · 快进快出</text>

  <!-- 第二遍 -->
  <rect x="355" y="96" width="250" height="280" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="355" y="96" width="250" height="38" rx="10" fill="#7c3aed"/>
  <rect x="355" y="120" width="250" height="14" fill="#7c3aed"/>
  <text x="480" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">第二遍 · 精读做卡</text>
  <text x="371" y="164" font-size="11.5" fill="#334155">通读全文，边读边填精读卡：</text>
  <text x="371" y="186" font-size="11.5" fill="#334155">· 核心贡献 3 点</text>
  <text x="371" y="206" font-size="11.5" fill="#334155">· 关键实验数据</text>
  <text x="371" y="226" font-size="11.5" fill="#334155">· 可跳过部分提示</text>
  <text x="371" y="258" font-size="12.5" font-weight="bold" fill="#7c3aed">看不懂先标记，不硬啃</text>
  <text x="371" y="356" font-size="10.5" fill="#64748b">用时：约 1~2 小时</text>

  <!-- 第三遍 -->
  <rect x="670" y="96" width="250" height="280" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="670" y="96" width="250" height="38" rx="10" fill="#ea580c"/>
  <rect x="670" y="120" width="250" height="14" fill="#ea580c"/>
  <text x="795" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">第三遍 · 带实现问题复读</text>
  <text x="686" y="164" font-size="11.5" fill="#334155">假设明天就要写进系统：</text>
  <text x="686" y="186" font-size="11.5" fill="#334155">· 方法细节怎么落地</text>
  <text x="686" y="206" font-size="11.5" fill="#334155">· 实验数据怎么来的、可信吗</text>
  <text x="686" y="226" font-size="11.5" fill="#334155">· 失败模式是什么</text>
  <text x="686" y="258" font-size="12.5" font-weight="bold" fill="#ea580c">仅对 ★★★ 论文做</text>
  <text x="686" y="356" font-size="10.5" fill="#64748b">用时：约 1 小时</text>

  <!-- 顶部顺序箭头 -->
  <path d="M 295 115 L 349 115" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar2)"/>
  <path d="M 610 115 L 664 115" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar2)"/>

  <!-- 第一遍分支 -->
  <rect x="40" y="396" width="250" height="42" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="165" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857">值得 → 进第二遍</text>
  <rect x="40" y="448" width="250" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="165" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">不值得 → 30 分钟止损，换下一篇</text>

  <!-- 第二遍产出 -->
  <rect x="355" y="396" width="250" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">产出：一张完整精读卡</text>
  <rect x="355" y="448" width="250" height="42" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="480" y="474" text-anchor="middle" font-size="11.5" fill="#6d28d9">卡壳清单 → 带进第三遍</text>

  <!-- 第三遍产出 -->
  <rect x="670" y="396" width="250" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="795" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c2410c">产出：可实现的方案草图</text>
  <rect x="670" y="448" width="250" height="42" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="795" y="474" text-anchor="middle" font-size="11.5" fill="#c2410c">衔接 001~010 对应专题代码</text>

  <!-- 分支/产出箭头 -->
  <path d="M 292 417 L 349 417" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar2)"/>
  <path d="M 607 417 L 664 417" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- 底部提示 -->
  <rect x="40" y="508" width="880" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="480" y="531" text-anchor="middle" font-size="11.5" fill="#1d4ed8">精读卡在 papers/01-必读十篇精读卡.md —— 先读中文精读卡，再读英文原文，不会迷路</text>
</svg>
