<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="660" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">贯穿案例：点价 Agent 端到端架构（003 问题篇 / 实战篇）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">绿=全自动 · 橙=自动执行+可回滚 · 红=强制人工确认 —— 分级自主是生产设计的主线</text>

  <defs>
    <marker id="p1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 入口 -->
  <rect x="40" y="96" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="105" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">客商邮件</text>
  <text x="105" y="144" text-anchor="middle" font-size="10.5" fill="#64748b">IMAP / 邮件网关接入</text>

  <!-- 输入护栏 -->
  <rect x="200" y="96" width="140" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">输入护栏</text>
  <text x="270" y="140" text-anchor="middle" font-size="10" fill="#991b1b">注入隔离：数据包 &lt;mail&gt;</text>
  <text x="270" y="156" text-anchor="middle" font-size="10" fill="#991b1b">联动 001 防御纵深</text>

  <line x1="170" y1="131" x2="198" y2="131" stroke="#94a3b8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 路由 -->
  <rect x="370" y="96" width="130" height="70" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="435" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#155e75">Routing 分流</text>
  <text x="435" y="140" text-anchor="middle" font-size="10" fill="#0e7490">点价 / 询价 / 投诉</text>
  <text x="435" y="156" text-anchor="middle" font-size="10" fill="#0e7490">垃圾 → 归档</text>
  <line x1="340" y1="131" x2="368" y2="131" stroke="#94a3b8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 抽取 -->
  <rect x="540" y="70" width="170" height="56" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="625" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">要素抽取（自动）</text>
  <text x="625" y="112" text-anchor="middle" font-size="10" fill="#047857">品种/数量/基差/合约月 → JSON</text>
  <line x1="500" y1="118" x2="538" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- Agent 循环 -->
  <rect x="540" y="150" width="170" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="625" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">Agent 循环</text>
  <text x="625" y="196" text-anchor="middle" font-size="10" fill="#1d4ed8">抽库存 → 查期货价 → 核算基差</text>
  <text x="625" y="213" text-anchor="middle" font-size="10" fill="#1d4ed8">缺信息 → 反问/查术语表</text>
  <text x="625" y="230" text-anchor="middle" font-size="10" fill="#1d4ed8">MAX_STEPS=20 硬刹车</text>
  <text x="625" y="252" text-anchor="middle" font-size="10" fill="#64748b">工具见 004 篇 004-05 图</text>
  <line x1="625" y1="126" x2="625" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 建议单 -->
  <rect x="540" y="294" width="170" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="625" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">生成点价建议单</text>
  <text x="625" y="336" text-anchor="middle" font-size="10" fill="#c2410c">挂 pending 状态（可回滚）</text>
  <line x1="625" y1="270" x2="625" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 人工确认 -->
  <rect x="540" y="398" width="170" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="625" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">交易员确认（人工）</text>
  <text x="625" y="444" text-anchor="middle" font-size="10" fill="#991b1b">看要素+建议价+Agent 理由</text>
  <text x="625" y="460" text-anchor="middle" font-size="10" fill="#991b1b">通过 / 驳回（驳回进评估集）</text>
  <line x1="625" y1="350" x2="625" y2="396" stroke="#94a3b8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 出口 -->
  <rect x="760" y="398" width="160" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="840" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065f46">落库 + 回执</text>
  <text x="840" y="444" text-anchor="middle" font-size="10" fill="#047857">CTRM 建单 / 回复邮件</text>
  <text x="840" y="460" text-anchor="middle" font-size="10" fill="#047857">（发送走白名单模板）</text>
  <line x1="710" y1="433" x2="758" y2="433" stroke="#94a3b8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- CTRM 支撑层 -->
  <rect x="40" y="220" width="440" height="150" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="260" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">工具层（读操作 · 全自动 · 权限最小化）</text>
  <rect x="60" y="260" width="190" height="44" rx="7" fill="#dbeafe"/>
  <text x="155" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">query_inventory</text>
  <text x="155" y="297" text-anchor="middle" font-size="10" fill="#1d4ed8">CTRM MySQL 库存视图（只读账号）</text>
  <rect x="270" y="260" width="190" height="44" rx="7" fill="#dbeafe"/>
  <text x="365" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">query_futures_price</text>
  <text x="365" y="297" text-anchor="middle" font-size="10" fill="#1d4ed8">期货行情 API（缓存 60s）</text>
  <rect x="60" y="312" width="190" height="44" rx="7" fill="#dbeafe"/>
  <text x="155" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">extract_email_elements</text>
  <text x="155" y="349" text-anchor="middle" font-size="10" fill="#1d4ed8">要素抽取（001 篇同款 prompt）</text>
  <rect x="270" y="312" width="190" height="44" rx="7" fill="#fee2e2"/>
  <text x="365" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">submit_pricing_proposal</text>
  <text x="365" y="349" text-anchor="middle" font-size="10" fill="#991b1b">唯一写工具 · 高危 · 挂起待确认</text>

  <line x1="480" y1="240" x2="538" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 底部评估 -->
  <rect x="40" y="524" width="880" height="96" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="480" y="550" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">评估与回流（06 篇落地）</text>
  <text x="480" y="576" text-anchor="middle" font-size="11.5" fill="#1d4ed8">30 封脱敏邮件回归集（正常 7 : 边界 3） · 任务成功率为主指标 · 步数/token 成本为辅</text>
  <text x="480" y="600" text-anchor="middle" font-size="11.5" fill="#1d4ed8">交易员驳回的案例自动回流评估集 —— 评估集是团队最值钱的资产</text>
</svg>
