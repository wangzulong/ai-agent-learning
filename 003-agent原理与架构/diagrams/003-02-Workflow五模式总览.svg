<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="660" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Anthropic Workflow 五模式总览（003 进阶篇）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">五种确定性编排骨架 —— 路径可预知的任务，用它们比 agent 更便宜更稳更好评</text>

  <defs>
    <marker id="w1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 模式1 chaining -->
  <rect x="40" y="86" width="880" height="96" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="40" y="86" width="180" height="96" rx="10" fill="#2563eb"/>
  <text x="130" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">① Prompt Chaining</text>
  <text x="130" y="146" text-anchor="middle" font-size="10.5" fill="#dbeafe">提示链 · 流水线</text>
  <rect x="250" y="112" width="90" height="30" rx="6" fill="#dbeafe"/><text x="295" y="132" text-anchor="middle" font-size="10.5" fill="#1e40af">抽取要素</text>
  <line x1="342" y1="127" x2="368" y2="127" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="370" y="112" width="90" height="30" rx="6" fill="#dbeafe"/><text x="415" y="132" text-anchor="middle" font-size="10.5" fill="#1e40af">查价计算</text>
  <line x1="462" y1="127" x2="488" y2="127" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="490" y="112" width="90" height="30" rx="6" fill="#dbeafe"/><text x="535" y="132" text-anchor="middle" font-size="10.5" fill="#1e40af">生成建议稿</text>
  <line x1="582" y1="127" x2="608" y2="127" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="610" y="112" width="70" height="30" rx="6" fill="#d1fae5"/><text x="645" y="132" text-anchor="middle" font-size="10.5" fill="#065f46">可加门</text>
  <text x="720" y="122" font-size="11" fill="#334155">适用：步骤固定能拆</text>
  <text x="720" y="140" font-size="11" fill="#64748b">代价：延迟串行叠加</text>
  <text x="720" y="158" font-size="11" fill="#64748b">门=中途校验，错了早停</text>

  <!-- 模式2 routing -->
  <rect x="40" y="194" width="880" height="96" rx="10" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/>
  <rect x="40" y="194" width="180" height="96" rx="10" fill="#0891b2"/>
  <text x="130" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">② Routing</text>
  <text x="130" y="254" text-anchor="middle" font-size="10.5" fill="#cffafe">路由 · 前台分诊</text>
  <rect x="250" y="220" width="80" height="30" rx="6" fill="#cffafe"/><text x="290" y="240" text-anchor="middle" font-size="10.5" fill="#155e75">输入</text>
  <line x1="332" y1="235" x2="356" y2="235" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="358" y="200" width="100" height="24" rx="5" fill="#e0f2fe"/><text x="408" y="217" text-anchor="middle" font-size="10" fill="#075985">点价申请→建单链</text>
  <rect x="358" y="228" width="100" height="24" rx="5" fill="#e0f2fe"/><text x="408" y="245" text-anchor="middle" font-size="10" fill="#075985">询价→报价链</text>
  <rect x="358" y="256" width="100" height="24" rx="5" fill="#e0f2fe"/><text x="408" y="273" text-anchor="middle" font-size="10" fill="#075985">投诉→人工</text>
  <text x="720" y="230" font-size="11" fill="#334155">适用：输入多样、路径有限</text>
  <text x="720" y="248" font-size="11" fill="#64748b">代价：分类错则全链错</text>
  <text x="720" y="266" font-size="11" fill="#64748b">每类可单独优化+评估</text>

  <!-- 模式3 parallelization -->
  <rect x="40" y="302" width="880" height="96" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="40" y="302" width="180" height="96" rx="10" fill="#059669"/>
  <text x="130" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">③ Parallelization</text>
  <text x="130" y="362" text-anchor="middle" font-size="10.5" fill="#d1fae5">并行 · 多窗口办事</text>
  <rect x="250" y="330" width="70" height="26" rx="5" fill="#d1fae5"/><text x="285" y="348" text-anchor="middle" font-size="10" fill="#065f46">邮件拆行</text>
  <line x1="298" y1="343" x2="322" y2="322" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <line x1="298" y1="343" x2="322" y2="378" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="326" y="308" width="96" height="26" rx="5" fill="#d1fae5"/><text x="374" y="326" text-anchor="middle" font-size="10" fill="#065f46">查库存·豆粕</text>
  <rect x="326" y="366" width="96" height="26" rx="5" fill="#d1fae5"/><text x="374" y="384" text-anchor="middle" font-size="10" fill="#065f46">查库存·菜粕</text>
  <line x1="424" y1="321" x2="452" y2="343" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <line x1="424" y1="379" x2="452" y2="347" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="456" y="330" width="70" height="26" rx="5" fill="#d1fae5"/><text x="491" y="348" text-anchor="middle" font-size="10" fill="#065f46">聚合</text>
  <text x="720" y="338" font-size="11" fill="#334155">适用：子任务互不依赖</text>
  <text x="720" y="356" font-size="11" fill="#64748b">代价：聚合逻辑要自己写</text>
  <text x="720" y="374" font-size="11" fill="#64748b">变体：投票（同一任务N次）</text>

  <!-- 模式4 orchestrator -->
  <rect x="40" y="410" width="880" height="96" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <rect x="40" y="410" width="180" height="96" rx="10" fill="#7c3aed"/>
  <text x="130" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">④ Orchestrator-Workers</text>
  <text x="130" y="470" text-anchor="middle" font-size="10.5" fill="#f3e8ff">编排者-工人</text>
  <rect x="250" y="438" width="80" height="26" rx="5" fill="#f3e8ff"/><text x="290" y="456" text-anchor="middle" font-size="10" fill="#6d28d9">编排者拆解</text>
  <line x1="332" y1="451" x2="356" y2="434" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <line x1="332" y1="451" x2="356" y2="468" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="360" y="422" width="90" height="24" rx="5" fill="#f3e8ff"/><text x="405" y="439" text-anchor="middle" font-size="10" fill="#6b21a8">工人A·查价</text>
  <rect x="360" y="456" width="90" height="24" rx="5" fill="#f3e8ff"/><text x="405" y="473" text-anchor="middle" font-size="10" fill="#6b21a8">工人B·合规</text>
  <line x1="452" y1="434" x2="478" y2="448" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <line x1="452" y1="468" x2="478" y2="454" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="482" y="438" width="80" height="26" rx="5" fill="#f3e8ff"/><text x="522" y="456" text-anchor="middle" font-size="10" fill="#6d28d9">汇总合成</text>
  <text x="720" y="446" font-size="11" fill="#334155">适用：要先规划再分派</text>
  <text x="720" y="464" font-size="11" fill="#64748b">代价：两跳 LLM，成本高</text>
  <text x="720" y="482" font-size="11" fill="#64748b">子任务无法预知才用它</text>

  <!-- 模式5 evaluator -->
  <rect x="40" y="518" width="880" height="96" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <rect x="40" y="518" width="180" height="96" rx="10" fill="#dc2626"/>
  <text x="130" y="556" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">⑤ Evaluator-Optimizer</text>
  <text x="130" y="578" text-anchor="middle" font-size="10.5" fill="#fee2e2">作者-审稿人循环</text>
  <rect x="250" y="546" width="80" height="26" rx="5" fill="#fee2e2"/><text x="290" y="564" text-anchor="middle" font-size="10" fill="#b91c1c">生成器</text>
  <line x1="332" y1="559" x2="360" y2="559" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <rect x="364" y="546" width="80" height="26" rx="5" fill="#fee2e2"/><text x="404" y="564" text-anchor="middle" font-size="10" fill="#b91c1c">评估器</text>
  <line x1="446" y1="552" x2="472" y2="559" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/>
  <text x="478" y="563" font-size="10" fill="#64748b">过→交付 / 不过→带意见回去改</text>
  <text x="720" y="554" font-size="11" fill="#334155">适用：有明确质量标尺</text>
  <text x="720" y="572" font-size="11" fill="#64748b">代价：轮数不可控，必设上限</text>
  <text x="720" y="590" font-size="11" fill="#64748b">标尺模糊=空转烧钱</text>

  <text x="480" y="644" text-anchor="middle" font-size="11.5" fill="#64748b">第一原则：能用 workflow 就别 agent —— 自主性每升一级，成本与不确定性同步上涨</text>
</svg>
