<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">自主性频谱与代价曲线（003 概念篇 / 进阶篇）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">从左到右：模型决定的事越来越多 —— 灵活性涨的同时，成本、延迟、评估难度同步上涨</text>

  <defs>
    <marker id="s1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 顶部箭头：灵活性 -->
  <line x1="90" y1="100" x2="900" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#s1)"/>
  <text x="495" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">灵活性与能力边界 ↑（模型自主决定的事变多）</text>

  <!-- 六级阶梯 -->
  <rect x="70" y="150" width="120" height="130" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">单次调用</text>
  <text x="130" y="202" text-anchor="middle" font-size="10" fill="#64748b">一问一答</text>
  <text x="130" y="219" text-anchor="middle" font-size="10" fill="#64748b">001 篇 territory</text>
  <text x="130" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">最便宜最好评</text>
  <text x="130" y="266" text-anchor="middle" font-size="10" fill="#64748b">无多步概念</text>

  <rect x="210" y="170" width="120" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">链 Chain</text>
  <text x="270" y="222" text-anchor="middle" font-size="10" fill="#1d4ed8">A→B→C 固定流水线</text>
  <text x="270" y="250" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">便宜 · 可预测</text>
  <text x="270" y="268" text-anchor="middle" font-size="10" fill="#64748b">失败点随链长增加</text>

  <rect x="350" y="190" width="120" height="90" rx="9" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="410" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#155e75">路由 Routing</text>
  <text x="410" y="242" text-anchor="middle" font-size="10" fill="#0e7490">按输入类型分流</text>
  <text x="410" y="266" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">分类错=全链错</text>

  <rect x="490" y="210" width="120" height="70" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065f46">并行 Parallel</text>
  <text x="550" y="260" text-anchor="middle" font-size="10" fill="#047857">独立子任务同时跑</text>
  <text x="550" y="276" text-anchor="middle" font-size="10" fill="#047857">省时间不省心智</text>

  <rect x="630" y="230" width="120" height="50" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="690" y="251" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">编排者 Orchestrator</text>
  <text x="690" y="270" text-anchor="middle" font-size="10" fill="#c2410c">先拆解再派工再汇总</text>

  <rect x="770" y="150" width="130" height="130" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="835" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">全自主 Agent</text>
  <text x="835" y="202" text-anchor="middle" font-size="10" fill="#991b1b">循环 + 工具 + 目标</text>
  <text x="835" y="219" text-anchor="middle" font-size="10" fill="#991b1b">路径模型临场定</text>
  <text x="835" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">最强也最贵最难评</text>
  <text x="835" y="266" text-anchor="middle" font-size="10" fill="#991b1b">五大失败模式全在</text>

  <!-- 底部代价箭头 -->
  <line x1="900" y1="330" x2="90" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#s1)" transform="translate(0,0)"/>
  <text x="495" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">← 朝左收缩：成本 / 延迟 / 评估难度 / 失败模式数量 全部下降</text>

  <!-- 决策提示 -->
  <rect x="70" y="390" width="850" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="495" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">选型口诀（Anthropic：Find the simplest solution possible）</text>
  <text x="495" y="442" text-anchor="middle" font-size="11.5" fill="#1d4ed8">路径可预知 → 用 workflow（左五格）；路径不可预知 → 才给 agent，且配足护栏与人在环</text>
  <text x="495" y="466" text-anchor="middle" font-size="11.5" fill="#1d4ed8">生产常态：workflow 骨架 + 局部 agent 节点 —— 确定性交给代码，临场判断才交给模型</text>
  <text x="495" y="488" text-anchor="middle" font-size="10.5" fill="#64748b">对照 07 篇决策树逐级收缩，直到失败风险可控为止</text>
</svg>
