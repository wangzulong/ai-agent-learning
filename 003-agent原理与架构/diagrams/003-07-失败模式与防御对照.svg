<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Agent 五大失败模式与防御对照（003 生产篇）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">每步 95% 正确，20 步后整体只剩 0.95²⁰ ≈ 36% —— 雪球效应是 Agent 生产化的头号敌人</text>

  <defs>
    <marker id="f1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 表头 -->
  <text x="200" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">失败模式</text>
  <text x="480" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">现场症状</text>
  <text x="760" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">防御手段</text>

  <!-- 1 雪球错误 -->
  <rect x="40" y="110" width="300" height="76" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="134" font-size="12.5" font-weight="bold" fill="#b91c1c">① 雪球错误</text>
  <text x="56" y="154" font-size="10.5" fill="#991b1b">小错被后续步骤当真并放大，</text>
  <text x="56" y="170" font-size="10.5" fill="#991b1b">越走越偏，收不回来</text>
  <line x1="342" y1="148" x2="366" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1)"/>
  <rect x="370" y="110" width="550" height="76" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="386" y="134" font-size="12" font-weight="bold" fill="#065f46">Checkpoint + 校验步 + sub-agent 隔离</text>
  <text x="386" y="154" font-size="10.5" fill="#047857">关键节点"回读确认"（查完库存复述一遍数量仓库）；能拆给</text>
  <text x="386" y="170" font-size="10.5" fill="#047857">sub-agent 的拆出去，错误被隔离在局部，不让它滚成雪球</text>

  <!-- 2 上下文腐烂 -->
  <rect x="40" y="198" width="300" height="76" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="222" font-size="12.5" font-weight="bold" fill="#b91c1c">② 上下文腐烂</text>
  <text x="56" y="242" font-size="10.5" fill="#991b1b">轨迹变长后早期关键约束被稀释，</text>
  <text x="56" y="258" font-size="10.5" fill="#991b1b">模型开始"看丢"最初的要求</text>
  <line x1="342" y1="236" x2="366" y2="236" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1)"/>
  <rect x="370" y="198" width="550" height="76" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="386" y="222" font-size="12" font-weight="bold" fill="#065f46">Anthropic 长任务三招</text>
  <text x="386" y="242" font-size="10.5" fill="#047857">compaction 压缩历史留关键决策 / structured notes 把状态外置</text>
  <text x="386" y="258" font-size="10.5" fill="#047857">成结构化笔记 / sub-agent 承接大块工作只回传摘要</text>

  <!-- 3 目标漂移 -->
  <rect x="40" y="286" width="300" height="76" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="310" font-size="12.5" font-weight="bold" fill="#b91c1c">③ 目标漂移</text>
  <text x="56" y="330" font-size="10.5" fill="#991b1b">跑着跑着忘了原始任务，</text>
  <text x="56" y="346" font-size="10.5" fill="#991b1b">开始"热心"做无关的事</text>
  <line x1="342" y1="324" x2="366" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1)"/>
  <rect x="370" y="286" width="550" height="76" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="386" y="310" font-size="12" font-weight="bold" fill="#065f46">计划外置 + 定期重锚</text>
  <text x="386" y="330" font-size="10.5" fill="#047857">任务清单写进上下文固定位置，每步对照勾选；每隔 N 步</text>
  <text x="386" y="346" font-size="10.5" fill="#047857">重新注入"目标+已完成进度"——给健忘的实习生贴便利贴</text>

  <!-- 4 死循环 -->
  <rect x="40" y="374" width="300" height="76" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="398" font-size="12.5" font-weight="bold" fill="#b91c1c">④ 死循环烧钱</text>
  <text x="56" y="418" font-size="10.5" fill="#991b1b">同一工具同参数反复调用，</text>
  <text x="56" y="434" font-size="10.5" fill="#991b1b">步数暴涨，任务原地踏步</text>
  <line x1="342" y1="412" x2="366" y2="412" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1)"/>
  <rect x="370" y="374" width="550" height="76" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="386" y="398" font-size="12" font-weight="bold" fill="#065f46">步数预算 + 重复检测 + 早停标准</text>
  <text x="386" y="418" font-size="10.5" fill="#047857">MAX_STEPS 硬刹车到点优雅降级（草稿转人工）；检测"同工具</text>
  <text x="386" y="434" font-size="10.5" fill="#047857">同参数"重复；达标即停（004 篇 agentic eagerness 谱系）</text>

  <!-- 5 幻觉行动 -->
  <rect x="40" y="462" width="300" height="76" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="486" font-size="12.5" font-weight="bold" fill="#b91c1c">⑤ 幻觉行动</text>
  <text x="56" y="506" font-size="10.5" fill="#991b1b">编造不存在的工具/参数，</text>
  <text x="56" y="522" font-size="10.5" fill="#991b1b">或对不确定的结果过度自信</text>
  <line x1="342" y1="500" x2="366" y2="500" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1)"/>
  <rect x="370" y="462" width="550" height="76" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="386" y="486" font-size="12" font-weight="bold" fill="#065f46">strict schema 校验 + 枚举约束 + "不确定就问人"</text>
  <text x="386" y="506" font-size="10.5" fill="#047857">工具参数 strict mode（004 篇），非法调用直接拒绝并回传可读</text>
  <text x="386" y="522" font-size="10.5" fill="#047857">错误让模型自纠；系统级规则：置信度低 → 挂起转人工</text>

  <!-- 底部总原则 -->
  <rect x="40" y="556" width="880" height="48" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="480" y="578" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">总原则：模型负责聪明，护栏负责兜底 —— 一切防御都落在代码层的确定性检查上</text>
  <text x="480" y="596" text-anchor="middle" font-size="10.5" fill="#1d4ed8">"让模型自己小心"不是护栏；评估与观测（trace 每一步）是发现以上五种模式的前提</text>
</svg>
