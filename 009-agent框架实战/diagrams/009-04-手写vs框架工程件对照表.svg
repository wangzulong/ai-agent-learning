<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="610" fill="#f8fafc"/>
  <text x="35" y="45" font-size="23" font-weight="bold" fill="#0f172a">009 · 003 手写循环 vs LangGraph 工程件对照</text>
  <text x="35" y="68" font-size="12" fill="#64748b">行 6~8 为「能力从无到有」（橙底高亮）—— 框架最值钱的部分；行 1~5 只是表达力升级</text>

  <!-- 表头 -->
  <rect x="35" y="92" width="30" height="34" fill="#1e40af"/>
  <rect x="65" y="92" width="150" height="34" fill="#1e40af"/>
  <rect x="215" y="92" width="245" height="34" fill="#1e40af"/>
  <rect x="460" y="92" width="240" height="34" fill="#1e40af"/>
  <rect x="700" y="92" width="225" height="34" fill="#1e40af"/>
  <text x="50" y="114" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">#</text>
  <text x="80" y="114" font-size="11.5" font-weight="bold" fill="#ffffff">手写工程件</text>
  <text x="230" y="114" font-size="11.5" font-weight="bold" fill="#ffffff">003 篇手写实现</text>
  <text x="475" y="114" font-size="11.5" font-weight="bold" fill="#ffffff">LangGraph 对应物</text>
  <text x="715" y="114" font-size="11.5" font-weight="bold" fill="#ffffff">框架多了什么</text>

  <!-- 行1 -->
  <rect x="35" y="126" width="890" height="42" fill="#ffffff"/>
  <text x="50" y="152" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text>
  <text x="80" y="152" font-size="10.5" fill="#0f172a">状态传递</text>
  <text x="230" y="152" font-size="10.5" fill="#64748b">dict 层层传参</text>
  <text x="475" y="152" font-size="10.5" fill="#334155">State(TypedDict) + reducer</text>
  <text x="715" y="152" font-size="10.5" fill="#334155">类型化 · 校验 · 并发合并</text>
  <!-- 行2 -->
  <rect x="35" y="168" width="890" height="42" fill="#f1f5f9"/>
  <text x="50" y="194" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">2</text>
  <text x="80" y="194" font-size="10.5" fill="#0f172a">路由分发</text>
  <text x="230" y="194" font-size="10.5" fill="#64748b">if/elif 关键词匹配</text>
  <text x="475" y="194" font-size="10.5" fill="#334155">条件边 / Command</text>
  <text x="715" y="194" font-size="10.5" fill="#334155">分支上图画 · 改动局部化</text>
  <!-- 行3 -->
  <rect x="35" y="210" width="890" height="42" fill="#ffffff"/>
  <text x="50" y="236" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">3</text>
  <text x="80" y="236" font-size="10.5" fill="#0f172a">业务步骤</text>
  <text x="230" y="236" font-size="10.5" fill="#64748b">一堆 handler 函数</text>
  <text x="475" y="236" font-size="10.5" fill="#334155">节点（统一签名）</text>
  <text x="715" y="236" font-size="10.5" fill="#334155">自动埋点 · 可单独测试</text>
  <!-- 行4 -->
  <rect x="35" y="252" width="890" height="42" fill="#f1f5f9"/>
  <text x="50" y="278" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text>
  <text x="80" y="278" font-size="10.5" fill="#0f172a">工具调用</text>
  <text x="230" y="278" font-size="10.5" fill="#64748b">手拼 JSON + 各写 try</text>
  <text x="475" y="278" font-size="10.5" fill="#334155">工具运行时（@tool）</text>
  <text x="715" y="278" font-size="10.5" fill="#334155">schema 校验 · 统一超时重试</text>
  <!-- 行5 -->
  <rect x="35" y="294" width="890" height="42" fill="#ffffff"/>
  <text x="50" y="320" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">5</text>
  <text x="80" y="320" font-size="10.5" fill="#0f172a">循环与终止</text>
  <text x="230" y="320" font-size="10.5" fill="#64748b">while + MAX_STEPS</text>
  <text x="475" y="320" font-size="10.5" fill="#334155">图的环 + recursion_limit</text>
  <text x="715" y="320" font-size="10.5" fill="#334155">引擎兜底 · 忘写也不死循环</text>
  <!-- 行6 高亮 -->
  <rect x="35" y="336" width="890" height="42" fill="#ffedd5"/>
  <text x="50" y="362" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">6</text>
  <text x="80" y="362" font-size="10.5" font-weight="bold" fill="#0f172a">人工确认</text>
  <text x="230" y="362" font-size="10.5" fill="#9a3412">input() 阻塞进程</text>
  <text x="475" y="362" font-size="10.5" font-weight="bold" fill="#ea580c">interrupt / resume</text>
  <text x="715" y="362" font-size="10.5" fill="#7c2d12">可挂起数天 · 可改状态再恢复</text>
  <!-- 行7 高亮 -->
  <rect x="35" y="378" width="890" height="42" fill="#ffedd5"/>
  <text x="50" y="404" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">7</text>
  <text x="80" y="404" font-size="10.5" font-weight="bold" fill="#0f172a">断点恢复</text>
  <text x="230" y="404" font-size="10.5" fill="#9a3412">（无）</text>
  <text x="475" y="404" font-size="10.5" font-weight="bold" fill="#ea580c">checkpointer（3 后端）</text>
  <text x="715" y="404" font-size="10.5" fill="#7c2d12">崩溃恢复 · time-travel</text>
  <!-- 行8 高亮 -->
  <rect x="35" y="420" width="890" height="42" fill="#ffedd5"/>
  <text x="50" y="446" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">8</text>
  <text x="80" y="446" font-size="10.5" font-weight="bold" fill="#0f172a">日志追踪</text>
  <text x="230" y="446" font-size="10.5" fill="#9a3412">print / logging 手埋</text>
  <text x="475" y="446" font-size="10.5" font-weight="bold" fill="#ea580c">trace / span 自动埋点</text>
  <text x="715" y="446" font-size="10.5" fill="#7c2d12">全链路 · 接 LangSmith/Langfuse</text>
  <!-- 行9 -->
  <rect x="35" y="462" width="890" height="42" fill="#ffffff"/>
  <text x="50" y="488" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">9</text>
  <text x="80" y="488" font-size="10.5" fill="#0f172a">输出推送</text>
  <text x="230" y="488" font-size="10.5" fill="#64748b">函数一次性返回</text>
  <text x="475" y="488" font-size="10.5" fill="#334155">stream（token / 事件）</text>
  <text x="715" y="488" font-size="10.5" fill="#334155">前端实时进度 · SSE 对接</text>

  <!-- 表格边框 -->
  <rect x="35" y="92" width="890" height="412" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="65" y1="92" x2="65" y2="504" stroke="#94a3b8" stroke-width="1"/>
  <line x1="215" y1="92" x2="215" y2="504" stroke="#94a3b8" stroke-width="1"/>
  <line x1="460" y1="92" x2="460" y2="504" stroke="#94a3b8" stroke-width="1"/>
  <line x1="700" y1="92" x2="700" y2="504" stroke="#94a3b8" stroke-width="1"/>

  <!-- 底部结论 -->
  <rect x="35" y="532" width="890" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="552" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">结论：1~5 表达力升级（能写的写法变优雅）；6~8 能力从无到有（手写做不起）；9 体验加分</text>
  <text x="480" y="569" font-size="10.5" fill="#64748b" text-anchor="middle">05 实战篇每段代码回扣本表行号 —— 逐段对账</text>
</svg>
